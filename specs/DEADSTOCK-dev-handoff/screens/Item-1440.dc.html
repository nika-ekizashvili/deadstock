      heartBtn: 'flex-shrink:0;width:58px;height:58px;display:flex;align-items:center;justify-content:center;border-radius:999px;cursor:pointer;' + (sv ? 'border:1px solid #D4FF3A;background:#D4FF3A;color:#0E0E0E' : 'border:1px solid #2E2E2B;background:transparent;color:#EDEDE8'),
      toggleHeart: function () { self.setState({ saved: !sv }); },
      d: {
        title: v.title, posted: v.posted, shop: v.shop, addr: v.addr, caption: v.caption,
        shopHref: 'Shop-1440.dc.html', avatar: 'background:' + v.color,
        reserved: v.status === 'reserved', sold: sold, notSold: !sold, video: !!v.video,
        priceText: v.price != null ? v.price + ' ₾' : '? ₾',
        priceTitle: v.price != null ? 'ფასი' : 'ფასი DM-ში',
        priceStyle: sold ? 'background:#A3A39B;color:#0E0E0E;text-decoration:line-through' : 'background:#EDEDE8;color:#0E0E0E'
      },
      chips: chips,
      multi: n > 1,
      photos: tones.map(function (t, k) {
        var on = k === i;
        return {
          aria: 'ფოტო ' + (k + 1), on: on ? 'true' : 'false',
          thumbStyle: 'display:block;width:80px;height:100px;padding:0;border-radius:4px;cursor:pointer;' + photo(t) + ';border:' + (on ? '2px solid #D4FF3A' : '1px solid #2E2E2B') + ';opacity:' + (on ? '1' : '.6'),
          pick: function () { self.setState({ i: k }); }
        };
      }),
      current: { style: photo(tones[i]), counter: (i + 1) + ' / ' + n },
      prev: function () { self.setState({ i: (i - 1 + n) % n }); },
      next: function () { self.setState({ i: (i + 1) % n }); }
    };
  }
}
</script>
