<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<title>Dashboard — schedule a drop — mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Noto+Sans+Georgian:wdth,wght@62.5..100,100..900&amp;display=swap">
<style>
body{margin:0;background:#0E0E0E}
a{color:#D4FF3A}a:hover{color:#EAFF8F}
:focus-visible{outline:2px solid #D4FF3A !important;outline-offset:3px}
.ds-btn{transition:transform .15s ease,background-color .15s ease,border-color .15s ease}
.ds-btn:active{transform:scale(.97)}
.ds-p:hover{background:#E6FF80 !important}
.ds-s:hover{border-color:#EDEDE8 !important;background:#222220 !important}
input::placeholder{color:#6E6E68}
@media (prefers-reduced-motion:reduce){.ds-btn{transition:none}}
.ds-grained::after{content:"";position:absolute;inset:0;z-index:40;pointer-events:none;opacity:0.22;mix-blend-mode:overlay;filter:url(#ds-grain)}
</style>
</helmet>
<div class="ds-grained" style="position: relative; overflow: hidden; width: 375px; min-height: 1000px; display: flex; flex-direction: column; background: #0E0E0E; color: #EDEDE8; font-family: 'Archivo', 'Noto Sans Georgian', system-ui, sans-serif">
<header style="display: flex; align-items: center; gap: 8px; padding: 8px 12px 8px 6px; border-bottom: 1px solid #2E2E2B">
<a href="Dash-375.dc.html" aria-label="უკან" title="უკან" style="flex-shrink: 0; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #EDEDE8"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg></a>
<h1 style="flex: 1; min-width: 0; margin: 0; font-family: 'Noto Sans Georgian', 'Archivo', sans-serif; font-size: 18px; font-weight: 800">ახალი დროპი</h1>

</header>
<main style="display: flex; flex-direction: column; gap: 24px; padding: 20px 16px 140px">
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.1em; color: #A3A39B">როდის?</span>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<button type="button" aria-pressed="{{d.on}}" aria-label="{{d.aria}}" onClick="{{d.pick}}" style="{{d.style}}"><span style="font-size: 11px; font-weight: 600; opacity: 0.8">{{d.wd}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 700">{{d.n}}</span></button>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{times}}" as="t" hint-placeholder-count="4">
<button type="button" aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; justify-content: space-between"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.1em; color: #A3A39B">რა შედის?</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: #D4FF3A">{{picked}}</span></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="8">
<button type="button" aria-pressed="{{it.on}}" aria-label="{{it.aria}}" onClick="{{it.toggle}}" style="{{it.style}}"><span style="{{it.check}}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span></button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.1em; color: #A3A39B">PREVIEW</span>
<div style="display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border: 1px solid #D4FF3A; border-radius: 12px; background: rgba(212, 255, 58, 0.06)">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: #D4FF3A">DROP</span>
<span style="flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 700">{{preview}}</span>
<span style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #2E2E2B; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"></path></svg></span>
</div>
</div>

<div style="display: flex; align-items: center; gap: 14px; padding: 14px 0; border-top: 1px solid #2E2E2B; border-bottom: 1px solid #2E2E2B">
<span style="flex-shrink: 0; width: 40px; height: 40px; border-radius: 999px; background: #171716; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h10v18H7zM11 18h2"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">IG Story ავტომატურად</span><span style="font-size: 13px; color: #A3A39B">−1 სთ</span></span>
<button type="button" role="switch" aria-checked="{{story.on}}" aria-label="{{story.label}}" onClick="{{story.toggle}}" style="{{story.track}}"><span style="{{story.knob}}"></span></button>
</div>
</main>
<div style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; align-items: center; gap: 12px; padding: 12px 16px 28px; background: rgba(14, 14, 14, 0.94); border-top: 1px solid #2E2E2B">
<span style="display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: #A3A39B"><span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; color: #EDEDE8">{{fans}}</span>ALERTS</span><a href="Shop-375.dc.html" class="ds-btn ds-p" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 999px; background: #D4FF3A; color: #0E0E0E; text-decoration: none; font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; letter-spacing: 0.04em">SCHEDULE<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v15H4zM4 10h16M8 3v4M16 3v4"></path></svg></a>
</div>
<svg aria-hidden="true" width="0" height="0" style="position: absolute; width: 0; height: 0; overflow: hidden"><filter id="ds-grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter></svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { day: 3, time: 2, off: { 5: true, 7: true }, story: true }; }
  renderVals() {
    var self = this, s = this.state;
    function sw(on, toggle) {
      return { on: on ? 'true' : 'false', toggle: toggle,
        track: 'flex-shrink:0;position:relative;width:52px;height:32px;padding:0;border:0;border-radius:999px;cursor:pointer;' + (on ? 'background:#D4FF3A' : 'background:#2E2E2B'),
        knob: 'position:absolute;top:4px;width:24px;height:24px;border-radius:999px;' + (on ? 'left:24px;background:#0E0E0E' : 'left:4px;background:#A3A39B') };
    }
    var WD = ['ოთხ', 'ხუთ', 'პარ', 'შაბ', 'კვი', 'ორ', 'სამ'];
    var N = [7, 8, 9, 10, 11, 12, 13];
    var TM = ['12:00', '18:00', '20:00', '22:00'];
    var tones = ['#3A332C', '#B9B0A2', '#2C363B', '#7A6E60', '#4A2F2A', '#2F3B2E', '#6B5A4C', '#8C8172'];
    var n = 0;
    var items = tones.map(function (t, i) {
      var on = !s.off[i]; if (on) n++;
      return { on: on ? 'true' : 'false', aria: 'ნივთი ' + (i + 1),
        toggle: function () { var o = Object.assign({}, s.off); o[i] = on; self.setState({ off: o }); },
        style: 'position:relative;aspect-ratio:4/5;padding:0;border:0;border-radius:4px;cursor:pointer;background:radial-gradient(120% 90% at 28% 18%, rgba(255,255,255,.14), rgba(255,255,255,0) 60%), ' + t + ';' + (on ? 'box-shadow:inset 0 0 0 2px #D4FF3A' : 'filter:grayscale(1) brightness(.5)'),
        check: 'position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:999px;display:flex;align-items:center;justify-content:center;' + (on ? 'background:#D4FF3A;color:#0E0E0E' : 'background:rgba(14,14,14,.5);color:transparent;box-shadow:inset 0 0 0 2px #EDEDE8') };
    });
    var st = sw(s.story, function () { self.setState({ story: !s.story }); }); st.label = 'IG Story ავტომატურად';
    return {
      days: WD.map(function (w, i) {
        var on = s.day === i;
        return { wd: w, n: String(N[i]), aria: w + ' ' + N[i] + ' ოქტ', on: on ? 'true' : 'false', pick: function () { self.setState({ day: i }); },
          style: 'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:60px;padding:0;border-radius:12px;font-family:inherit;cursor:pointer;' + (on ? 'border:0;background:#D4FF3A;color:#0E0E0E' : 'border:1px solid #2E2E2B;background:transparent;color:#EDEDE8') };
      }),
      times: TM.map(function (t, i) {
        var on = s.time === i;
        return { label: t, on: on ? 'true' : 'false', pick: function () { self.setState({ time: i }); },
          style: "height:44px;border-radius:999px;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;cursor:pointer;" + (on ? 'border:0;background:#EDEDE8;color:#0E0E0E' : 'border:1px solid #2E2E2B;background:transparent;color:#A3A39B') };
      }),
      items: items, picked: n + ' ITEMS',
      preview: WD[s.day].toUpperCase() + ' ' + N[s.day] + ' · ' + TM[s.time],
      story: st, fans: '214'
    };
  }
}
</script>
</body>
</html>
