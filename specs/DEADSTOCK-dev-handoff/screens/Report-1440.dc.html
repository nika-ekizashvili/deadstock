<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<title>Report a listing — desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Noto+Sans+Georgian:wdth,wght@62.5..100,100..900&amp;display=swap">
<style>
body{margin:0;background:#0E0E0E}
a{color:#D4FF3A}a:hover{color:#EAFF8F}
:focus-visible{outline:2px solid #D4FF3A !important;outline-offset:3px}
.ds-btn{transition:transform .15s ease,background-color .15s ease,border-color .15s ease}
.ds-btn:active{transform:scale(.97)}
.ds-p:hover{background:#E6FF80 !important}
.ds-s:hover{border-color:#EDEDE8 !important;background:#222220 !important}
input::placeholder{color:#6E6E68}
@media (prefers-reduced-motion:reduce){.ds-btn{transition:none}}
.ds-grained::after{content:"";position:absolute;inset:0;z-index:40;pointer-events:none;opacity:0.22;mix-blend-mode:overlay;filter:url(#ds-grain)}
</style>
</helmet>
<div class="ds-grained" style="position: relative; overflow: hidden; min-height: 900px; display: flex; flex-direction: column; background: #0E0E0E; color: #EDEDE8; font-family: 'Archivo', 'Noto Sans Georgian', system-ui, sans-serif">
<div aria-hidden="true" style="position: absolute; inset: 0; display: flex; gap: 48px; padding: 96px 48px 0; filter: blur(4px) brightness(.4)">
<div style="flex: 0 0 45%; aspect-ratio: 4 / 5; border-radius: 6px; background: radial-gradient(120% 90% at 28% 18%, rgba(255,255,255,.14), rgba(255,255,255,0) 60%), #5B5248"></div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding-top: 20px"><div style="width: 70%; height: 44px; border-radius: 6px; background: #222220"></div><div style="width: 40%; height: 24px; border-radius: 6px; background: #171716"></div><div style="width: 100%; height: 58px; border-radius: 999px; background: #D4FF3A; opacity: .5"></div></div>
</div>
<div role="dialog" aria-modal="true" aria-labelledby="rep-title" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 520px; max-width: calc(100% - 32px); box-sizing: border-box; z-index: 10; display: flex; flex-direction: column; gap: 16px; padding: 28px 28px 28px; background: #171716; border: 1px solid #2E2E2B; border-radius: 22px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6)">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<h2 id="rep-title" style="display: flex; align-items: center; gap: 10px; margin: 0; font-size: 22px; font-weight: 800"><span style="color: #FF6B4A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"></path></svg></span>რა ხდება?</h2>
<a href="Item-1440.dc.html" aria-label="დახურვა" title="დახურვა" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #222220; color: #EDEDE8"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
</div>

<sc-if value="{{choosing}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<div role="radiogroup" aria-label="მიზეზი" style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{reasons}}" as="r" hint-placeholder-count="5">
<button type="button" role="radio" aria-checked="{{r.on}}" onClick="{{r.pick}}" style="{{r.style}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg><span style="flex: 1; text-align: left">{{r.label}}</span><span style="{{r.dot}}"></span></button>
</sc-for>
</div>
<label style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; background: #0E0E0E; border: 1px solid #2E2E2B; border-radius: 12px"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">დეტალები</span><input placeholder="+ დეტალები" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #EDEDE8; font-family: inherit; font-size: 16px; font-size: 15px"></label>
<button type="button" class="ds-btn" onClick="{{send}}" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border: 0; border-radius: 999px; background: #FF6B4A; color: #0E0E0E; font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; letter-spacing: 0.04em; cursor: pointer">REPORT<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>
</sc-if>

<sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px; padding: 8px 0 4px">
<span style="width: 56px; height: 56px; border-radius: 999px; background: #D4FF3A; color: #0E0E0E; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span>
<span style="font-size: 22px; line-height: 29px; font-weight: 800">მივიღეთ.</span>
<span style="font-size: 14px; line-height: 21px; color: #A3A39B"></span>
<a href="Item-1440.dc.html" class="ds-btn ds-s" style="display: flex; align-items: center; justify-content: center; height: 52px; border: 1px solid #2E2E2B; border-radius: 999px; color: #EDEDE8; text-decoration: none; font-size: 15px; font-weight: 700">OK</a>
</div>
</sc-if>

<div style="display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; background: #0E0E0E; font-size: 13px; line-height: 19px">
<span style="flex-shrink: 0; color: #D4FF3A"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"></path></svg></span>
<span><strong>ჯერ ნახე → მერე გადაიხადე</strong></span>
</div>
</div>
<svg aria-hidden="true" width="0" height="0" style="position: absolute; width: 0; height: 0; overflow: hidden"><filter id="ds-grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter></svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { r: 1, sent: false }; }
  renderVals() {
    var self = this, s = this.state;
    var R = [
      ['ყალბი / რეპლიკა', 'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM4 20 20 4'],
      ['წინასწარ გადახდას ითხოვს', 'M3 7h18v12H3zM3 11h18M7 15h3'],
      ['უკვე გაყიდულია', 'M5 12l5 5 9-10'],
      ['ფასი არ ემთხვევა', 'M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z'],
      ['შეურაცხმყოფელი', 'M12 3 2 20h20zM12 10v4M12 17h.01']
    ];
    return {
      choosing: !s.sent, sent: s.sent,
      send: function () { self.setState({ sent: true }); },
      reasons: R.map(function (r, i) {
        var on = s.r === i;
        return { label: r[0], icon: r[1], on: on ? 'true' : 'false', pick: function () { self.setState({ r: i }); },
          style: 'display:flex;align-items:center;gap:12px;min-height:52px;padding:0 14px;border-radius:12px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;' + (on ? 'border:1px solid #FF6B4A;background:rgba(255,107,74,.08);color:#EDEDE8' : 'border:1px solid #2E2E2B;background:transparent;color:#A3A39B'),
          dot: 'flex-shrink:0;width:20px;height:20px;box-sizing:border-box;border-radius:999px;' + (on ? 'border:6px solid #FF6B4A' : 'border:2px solid #2E2E2B') };
      })
    };
  }
}
</script>
</body>
</html>
