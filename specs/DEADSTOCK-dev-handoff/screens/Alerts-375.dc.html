<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<title>Alerts and sizes — mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Noto+Sans+Georgian:wdth,wght@62.5..100,100..900&amp;display=swap">
<style>
body{margin:0;background:#0E0E0E}
a{color:#D4FF3A}a:hover{color:#EAFF8F}
:focus-visible{outline:2px solid #D4FF3A !important;outline-offset:3px}
.ds-btn{transition:transform .15s ease,background-color .15s ease,color .15s ease}
.ds-btn:active{transform:scale(.92)}
@media (prefers-reduced-motion:reduce){.ds-btn{transition:none}}
</style>
</helmet>
<div style="position: relative; overflow: hidden; width: 375px; min-height: 1300px; background: #0E0E0E; color: #EDEDE8; font-family: 'Archivo', 'Noto Sans Georgian', system-ui, sans-serif">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #2E2E2B">
<span style="display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 800">
<svg width="22" height="22" viewBox="0 0 24 24" fill="#D4FF3A" stroke="#D4FF3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"></path><path d="M10 21h4" fill="none"></path></svg>
ალერტები</span>
<span style="display: flex; align-items: center; gap: 4px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A3A39B">{{activeCount}} ON</span><a href="Notif-375.dc.html" aria-label="პარამეტრები" title="პარამეტრები" style="width: 44px; height: 44px; margin-right: -10px; display: flex; align-items: center; justify-content: center; color: #EDEDE8"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg></a></span>
</header>

<section style="display: flex; flex-direction: column; gap: 12px; padding: 20px 16px">
<span style="display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #A3A39B">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17 17 3l4 4L7 21z"></path><path d="m7 13 2 2"></path><path d="m10 10 2 2"></path><path d="m13 7 2 2"></path></svg>
MY SIZES</span>
<sc-for list="{{sizeGroups}}" as="g" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 6px; overflow-x: auto">
<span title="{{g.title}}" style="flex-shrink: 0; width: 32px; color: #A3A39B; display: flex; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{g.icon}}"></path></svg></span>
<sc-for list="{{g.sizes}}" as="s" hint-placeholder-count="5">
<button type="button" class="ds-btn" aria-pressed="{{s.on}}" onClick="{{s.toggle}}" style="{{s.style}}">{{s.v}}</button>
</sc-for>
</div>
</sc-for>
</section>

<section style="display: flex; flex-direction: column; gap: 10px; padding: 20px 16px; border-top: 1px solid #2E2E2B">
<span style="display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #A3A39B">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
SEARCHES</span>
<sc-for list="{{searches}}" as="a" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; border-radius: 14px; background: #171716">
<div style="flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
<span style="font-size: 15px; font-weight: 700">{{a.q}}</span>
<sc-for list="{{a.tags}}" as="t" hint-placeholder-count="2">
<span style="padding: 2px 8px; border: 1px solid #2E2E2B; border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #A3A39B">{{t}}</span>
</sc-for>
</div>
<button type="button" class="ds-btn" aria-label="ალერტი" aria-pressed="{{a.on}}" onClick="{{a.toggle}}" style="{{a.style}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="{{a.fill}}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"></path><path d="M10 21h4"></path></svg></button>
</div>
</sc-for>
<label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 8px 0 16px; border: 1px dashed #2E2E2B; border-radius: 14px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D4FF3A" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
<input type="text" aria-label="ახალი ალერტი" placeholder="levis 501, kaba…" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #EDEDE8; font-family: inherit; font-size: 15px">
</label>
</section>

<section style="display: flex; flex-direction: column; gap: 10px; padding: 20px 16px; border-top: 1px solid #2E2E2B">
<span style="display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #A3A39B">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h16l-1.5-5h-13z"></path><path d="M5 9v11h14V9"></path></svg>
SHOPS</span>
<sc-for list="{{shops}}" as="sh" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 40px; height: 40px; border-radius: 999px; {{sh.avatar}}"></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 700">{{sh.n}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #A3A39B">{{sh.next}}</span>
</div>
<button type="button" class="ds-btn" aria-label="ალერტი" aria-pressed="{{sh.on}}" onClick="{{sh.toggle}}" style="{{sh.style}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="{{sh.fill}}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"></path><path d="M10 21h4"></path></svg></button>
</div>
</sc-for>
</section>

<section style="display: flex; flex-direction: column; gap: 10px; padding: 20px 16px 120px; border-top: 1px solid #2E2E2B">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.1em; color: #A3A39B">LATEST</span>
<sc-for list="{{feed}}" as="f" hint-placeholder-count="3">
<a href="Item-375.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 14px; background: #171716; color: #EDEDE8; text-decoration: none">
<span style="flex-shrink: 0; width: 44px; height: 55px; border-radius: 4px; {{f.photo}}"></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 14px; font-weight: 800">{{f.t}}</span>
<span style="font-size: 12px; color: #A3A39B">{{f.why}}</span>
</div>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #A3A39B">{{f.ago}}</span>
</a>
</sc-for>
</section>

<nav aria-label="მენიუ" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-around; padding: 8px 8px 26px; background: rgba(14, 14, 14, 0.94); border-top: 1px solid #2E2E2B">
<sc-for list="{{tabs}}" as="tb" hint-placeholder-count="5">
<a href="{{tb.href}}" aria-label="{{tb.n}}" title="{{tb.n}}" style="{{tb.style}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{tb.d}}"></path></svg><sc-if value="{{tb.dot}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: 8px; right: 12px; width: 8px; height: 8px; border-radius: 999px; background: #D4FF3A"></span></sc-if></a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":1300}}'>
class Component extends DCLogic {

      { t: 'ზაფხულის კაბა · M · 35 ₾', why: 'kaba · M', ago: '1სთ', c: '#B9B0A2' },

</body>
</html>
