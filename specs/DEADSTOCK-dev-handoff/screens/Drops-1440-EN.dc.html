<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Noto+Sans+Georgian:wdth,wght@62.5..100,100..900&amp;display=swap">
<style>
body{margin:0;background:#0E0E0E}
a{color:#D4FF3A}a:hover{color:#EAFF8F}
:focus-visible{outline:2px solid #D4FF3A !important;outline-offset:3px}
.ds-card .ds-ph{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.ds-card:hover .ds-ph{transform:scale(1.05)}
.ds-card:hover .ds-t{text-decoration:underline;text-underline-offset:3px}
.ds-card .ds-tag{transition:transform .25s ease}
.ds-card:hover .ds-tag{transform:rotate(0deg) translateY(-2px) !important}
.ds-btn{transition:transform .15s ease,background-color .15s ease,border-color .15s ease}
.ds-btn:active{transform:scale(.97)}
.ds-p:hover{background:#E6FF80 !important}
.ds-s:hover{border-color:#EDEDE8 !important;background:#222220 !important}
.ds-chip:hover{border-color:#6E6E68 !important}
.ds-marquee{animation:ds-marquee 60s linear infinite}
.ds-tick:hover .ds-marquee{animation-play-state:paused}
@keyframes ds-marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ds-sk{animation:ds-pulse 1.4s ease-in-out infinite}
@keyframes ds-pulse{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.ds-marquee,.ds-sk{animation:none}.ds-card .ds-ph,.ds-card .ds-tag,.ds-btn{transition:none}}
.ds-grained::after{content:"";position:absolute;inset:0;z-index:40;pointer-events:none;opacity:0.22;mix-blend-mode:overlay;filter:url(#ds-grain)}
</style>
</helmet>

</nav>
<a href="SignIn-1440.dc.html" class="ds-btn ds-s" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border: 1px solid #2E2E2B; border-radius: 999px; color: #EDEDE8; text-decoration: none; font-size: 15px; font-weight: 700">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h16l-1.5-5h-13z"></path><path d="M5 9v11h14V9"></path><path d="M10 20v-6h4v6"></path></svg>
Sell</a>
<div role="group" aria-label="Language" style="display: flex; padding: 3px; background: #171716; border: 1px solid #2E2E2B; border-radius: 999px">
<a href="Drops-1440.dc.html" aria-pressed="false" style="display: inline-flex; align-items: center; justify-content: center; height: 36px; min-width: 52px; padding: 0 12px; border-radius: 999px; color: #A3A39B; text-decoration: none; font-family: inherit; font-size: 13px; font-weight: 600">ქარ</a>
<button type="button" aria-pressed="true" style="height: 36px; min-width: 52px; padding: 0 12px; border: 0; border-radius: 999px; background: #EDEDE8; color: #0E0E0E; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700">ENG</button>
</div>
</div>
</div>
</header>
<main style="max-width: 1440px; margin: 0 auto; padding: 40px 48px 96px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 40px">
<section style="position: relative; flex: 1 1 520px; min-height: 520px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 28px; padding: 40px; border-radius: 24px; background: #D4FF3A; color: #0E0E0E; overflow: hidden; isolation: isolate">
<span aria-hidden="true" style="position: absolute; right: -40px; bottom: -60px; font-weight: 900; font-stretch: 125%; font-size: 300px; line-height: 1; letter-spacing: -0.06em; color: rgba(14, 14, 14, 0.07); z-index: -1">THU</span>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.14em">COMMUNITY DROP · 6 SHOPS</span>
<h1 style="margin: 0; font-weight: 900; font-stretch: 125%; font-size: 84px; line-height: 0.88; letter-spacing: -0.05em">DEADSTOCK<br>THURSDAY</h1>
</div>
<div style="display: flex; align-items: center; gap: 14px">
<div style="display: flex"><sc-for list="{{crew}}" as="c" hint-placeholder-count="6"><span style="{{c.style}}"></span></sc-for></div>
<span style="font-size: 16px; font-weight: 700">Thu · 20:00</span>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<span style="flex: 1; display: flex; align-items: center; justify-content: center; height: 72px; border-radius: 999px; background: #0E0E0E; color: #D4FF3A; font-family: 'JetBrains Mono', monospace; font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums">2d 14:22:05</span>
<button type="button" class="ds-btn" aria-label="Remind me" title="Remind me" aria-pressed="{{remAria}}" onClick="{{toggleRem}}" style="{{remStyle}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="{{remFill}}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"></path></svg></button>
</div>
</section>

<section aria-label="Calendar" style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<div role="group" aria-label="Day" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<button type="button" class="ds-btn" aria-pressed="{{d.on}}" onClick="{{d.pick}}" style="{{d.style}}"><span style="font-size: 13px">{{d.n}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700">{{d.date}}</span><span style="{{d.dot}}"></span></button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{drops}}" as="x" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 16px; padding: 14px 16px; border-radius: 16px; background: #171716; {{x.border}}">
<div style="width: 72px; display: flex; flex-direction: column; align-items: center; gap: 2px">
<sc-if value="{{x.live}}" hint-placeholder-val="{{ false }}"><span style="width: 10px; height: 10px; border-radius: 999px; background: #D4FF3A"></span><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #D4FF3A">LIVE</span></sc-if>
<sc-if value="{{x.notLive}}" hint-placeholder-val="{{ true }}"><span style="font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700">{{x.time}}</span></sc-if>
</div>
<span style="flex-shrink: 0; width: 48px; height: 48px; border-radius: 999px; {{x.avatar}}"></span>
<a href="Shop-1440-EN.dc.html" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; color: #EDEDE8; text-decoration: none"><span style="font-size: 17px; font-weight: 700">{{x.shop}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A3A39B">{{x.n}} ITEMS</span></a>
<div style="display: flex; gap: 6px">
<sc-for list="{{x.thumbs}}" as="t" hint-placeholder-count="3"><span style="{{t}}"></span></sc-for>
</div>
<button type="button" class="ds-btn" aria-label="Alert" title="Alert" aria-pressed="{{x.on}}" onClick="{{x.toggle}}" style="{{x.style}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="{{x.fill}}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"></path></svg></button>
</div>
</sc-for>
</div>
</section>
</main>
<footer style="border-top: 1px solid #2E2E2B">
<div style="max-width: 1440px; margin: 0 auto; padding: 48px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px">
<span style="font-weight: 900; font-stretch: 125%; font-size: 64px; line-height: 0.85; letter-spacing: -0.04em; color: #222220">DEADSTOCK</span>
<a href="SignIn-1440.dc.html" style="display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h16l-1.5-5h-13z"></path><path d="M5 9v11h14V9"></path><path d="M10 20v-6h4v6"></path></svg>
Sell →</a>
</div>
</footer>

<svg aria-hidden="true" width="0" height="0" style="position: absolute; width: 0; height: 0; overflow: hidden"><filter id="ds-grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter></svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { day: 0, rem: false, on: { 1: true } }; }
  renderVals() {
    var self = this, st = this.state;
    var crew = ['#C9A27A', '#6F8FA6', '#8E9B6A', '#B07A6E', '#9A8FB0', '#5E7D6A'].map(function (c, i) { return { style: 'width:40px;height:40px;border-radius:999px;border:3px solid #D4FF3A;background:' + c + ';margin-left:' + (i ? '-12px' : '0') }; });
    var D = [['Mon', '6', true], ['Tue', '7', false], ['Wed', '8', true], ['Thu', '9', true], ['Fri', '10', false], ['Sat', '11', true], ['Sun', '12', false]];
    function bell(on) { return 'flex-shrink:0;width:44px;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer;' + (on ? 'border:0;background:#D4FF3A;color:#0E0E0E' : 'border:1px solid #2E2E2B;background:transparent;color:#A3A39B'); }
    var drops = [
      { time: 'LIVE', live: true, shop: 'Second Wind', c: '#6F8FA6', n: 8, t: ['#2F3B2E', '#55443A', '#A39783'] },
      { time: '20:00', shop: 'ძველი კარადა', c: '#C9A27A', n: 12, t: ['#4A2F2A', '#B9B0A2', '#2C363B'] },
      { time: '21:30', shop: 'ფარდული', c: '#B07A6E', n: 6, t: ['#7A6E60', '#3D3A45', '#B9B0A2'] },
      { time: '22:00', shop: 'Garage 41', c: '#8E9B6A', n: 15, t: ['#3A332C', '#1F2326', '#8C8172'] }
    ].map(function (x, i) {
      var on = !!st.on[i];
      return { time: x.time, live: !!x.live, notLive: !x.live, shop: x.shop, n: String(x.n), avatar: 'background:' + x.c,
        thumbs: x.t.map(function (c) { return 'width:44px;height:55px;border-radius:4px;background:' + c + (x.live ? '' : ';filter:blur(4px) brightness(.7)'); }),
        border: x.live ? 'border:1px solid #D4FF3A' : 'border:1px solid transparent',
        on: on ? 'true' : 'false', fill: on ? 'currentColor' : 'none', style: bell(on),
        toggle: function () { var o = Object.assign({}, st.on); o[i] = !o[i]; self.setState({ on: o }); } };
    });
    return {
      savedN: '3', crew: crew, drops: drops,
      days: D.map(function (d, i) { var on = st.day === i; return { n: d[0], date: d[1], on: on ? 'true' : 'false', pick: function () { self.setState({ day: i }); },
        style: 'display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0;border-radius:16px;cursor:pointer;font-family:inherit;' + (on ? 'border:1px solid #EDEDE8;background:#EDEDE8;color:#0E0E0E' : 'border:1px solid #2E2E2B;background:transparent;color:#EDEDE8'),
        dot: 'width:6px;height:6px;border-radius:999px;background:' + (d[2] ? (on ? '#0E0E0E' : '#D4FF3A') : 'transparent') }; }),
      remAria: st.rem ? 'true' : 'false', remFill: st.rem ? 'currentColor' : 'none',
      remStyle: 'flex-shrink:0;width:72px;height:72px;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer;' + (st.rem ? 'border:0;background:#0E0E0E;color:#D4FF3A' : 'border:2px solid #0E0E0E;background:transparent;color:#0E0E0E'),
      toggleRem: function () { self.setState({ rem: !st.rem }); }
    };
  }
}
</script>
</body>
