<!doctype html>

<head>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Noto+Sans+Georgian:wdth,wght@62.5..100,100..900&amp;display=swap">
<style>
body{margin:0;background:#0E0E0E}
a{color:#D4FF3A}a:hover{color:#EAFF8F}

.ds-btn{transition:transform .15s ease,background-color .15s ease,border-color .15s ease}
.ds-btn:active{transform:scale(.97)}
.ds-p:hover{background:#E6FF80 !important}
.ds-s:hover{border-color:#EDEDE8 !important;background:#222220 !important}

</style>
</helmet>
<div class="ds-grained" style="position: relative; overflow: hidden; min-height: 1032px; display: flex; flex-direction: column; background: #0E0E0E; color: #EDEDE8; font-family: 'Archivo', 'Noto Sans Georgian', system-ui, sans-serif">
<header style="border-bottom: 1px solid #2E2E2B">
<div style="max-width: 1440px; margin: 0 auto; padding: 14px 48px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<div style="display: flex; align-items: center; gap: 14px">
<a href="Home-1440.dc.html" style="color: #EDEDE8; text-decoration: none; font-weight: 900; font-stretch: 125%; font-size: 20px; letter-spacing: -0.04em">DEADSTOCK</a>
<span style="padding: 3px 8px; border: 1px solid #2E2E2B; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #A3A39B">SHOP PANEL</span>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<div role="group" aria-label="ენა / Language" style="display: flex; padding: 3px; background: #171716; border: 1px solid #2E2E2B; border-radius: 999px">
<button type="button" aria-pressed="true" style="height: 36px; min-width: 52px; padding: 0 12px; border: 0; border-radius: 999px; background: #EDEDE8; color: #0E0E0E; font-family: inherit; font-size: 13px; font-weight: 700">ქარ</button>
<button type="button" aria-pressed="false" style="height: 36px; min-width: 52px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: #A3A39B; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500">ENG</button>
</div>
<a href="SignIn-1440.dc.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 16px; border: 1px solid #2E2E2B; border-radius: 999px; color: #EDEDE8; text-decoration: none; font-size: 14px; font-weight: 600">გასვლა</a>
</div>
</div>
</header>
<div style="position: relative; width: 100%; max-width: 600px; box-sizing: border-box; margin: 40px auto 96px; border: 1px solid #2E2E2B; border-radius: 20px; overflow: hidden; background: #0E0E0E">
<header style="display: flex; align-items: center; gap: 8px; padding: 8px 12px 8px 6px; border-bottom: 1px solid #2E2E2B">
<a href="Dash-1440.dc.html" aria-label="უკან" title="უკან" style="flex-shrink: 0; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #EDEDE8"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg></a>
<h1 style="flex: 1; min-width: 0; margin: 0; font-family: 'Noto Sans Georgian', 'Archivo', sans-serif; font-size: 18px; font-weight: 800">დაჯავშნა</h1>

</header>
<main style="display: flex; flex-direction: column; gap: 22px; padding: 20px 16px 140px">
<div style="display: flex; align-items: center; gap: 14px; padding: 10px; border-radius: 12px; background: #171716">
<span style="flex-shrink: 0; width: 64px; aspect-ratio: 4 / 5; border-radius: 4px; background: radial-gradient(120% 90% at 28% 18%, rgba(255,255,255,.14), rgba(255,255,255,0) 60%), #3A332C"></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Pepe Jeans leather jacket</span>
<span style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px 4px 6px; border-radius: 3px; background: #EDEDE8; color: #0E0E0E; font-size: 14px; font-weight: 800; transform: rotate(-3deg)"><span style="width: 5px; height: 5px; border-radius: 999px; background: #0E0E0E"></span>220 ₾</span></span>
</div>

<sc-if value="{{setup}}" hint-placeholder-val="{{ true }}">

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.1em; color: #A3A39B">ვისთვის?</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{buyers}}" as="b" hint-placeholder-count="3">
<button type="button" aria-pressed="{{b.on}}" onClick="{{b.pick}}" style="{{b.style}}"><span style="{{b.av}}"></span>{{b.h}}</button>
</sc-for>
</div>
<label style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; background: #171716; border: 1px solid #2E2E2B; border-radius: 12px"><span style="color: #A3A39B; font-family: 'JetBrains Mono', monospace">@</span><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Instagram სახელი</span><input value="{{buyerInput}}" placeholder="სხვა" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #EDEDE8; font-family: inherit; font-size: 16px; font-family: 'JetBrains Mono', monospace"></label>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.1em; color: #A3A39B">რამდენ ხანს?</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{durs}}" as="d" hint-placeholder-count="3">
<button type="button" aria-pressed="{{d.on}}" onClick="{{d.pick}}" style="{{d.style}}">{{d.label}}</button>
</sc-for>
</div>
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #A3A39B"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v5l3 2M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18z"></path></svg>{{until}}</span>
</div>
</div>
</sc-if>

<sc-if value="{{active}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 14px; padding: 22px 20px; border: 1px solid #D4FF3A; border-radius: 16px; background: rgba(212, 255, 58, 0.06)">
<span style="display: inline-flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #D4FF3A"><span style="width: 26px; height: 26px; border-radius: 999px; background: #D4FF3A; color: #0E0E0E; display: inline-flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h12M6 22h12M7 2v4c0 3 5 4 5 6s-5 3-5 6v4M17 2v4c0 3-5 4-5 6s5 3 5 6v4"></path></svg></span>ON HOLD · {{buyer}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 48px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums">{{left}}</span>
<span style="font-size: 13px; color: #A3A39B"></span>
</div>
</sc-if>
</main>
<div style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; align-items: center; gap: 12px; padding: 12px 16px 28px; background: rgba(14, 14, 14, 0.94); border-top: 1px solid #2E2E2B">
<sc-if value="{{setup}}" hint-placeholder-val="{{ true }}"><button type="button" class="ds-btn ds-p" onClick="{{confirm}}" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 999px; background: #D4FF3A; color: #0E0E0E; text-decoration: none; font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; letter-spacing: 0.04em; border: 0; cursor: pointer">HOLD<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h12M6 22h12M7 2v4c0 3 5 4 5 6s-5 3-5 6v4M17 2v4c0 3-5 4-5 6s5 3 5 6v4"></path></svg></button></sc-if>
<sc-if value="{{active}}" hint-placeholder-val="{{ false }}"><button type="button" class="ds-btn ds-s" onClick="{{release}}" aria-label="გაუქმება" title="გაუქმება" style="flex-shrink: 0; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; border: 1px solid #2E2E2B; border-radius: 999px; background: transparent; color: #EDEDE8; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button><a href="Dash-1440.dc.html" class="ds-btn ds-p" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 999px; background: #D4FF3A; color: #0E0E0E; text-decoration: none; font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; letter-spacing: 0.04em"><span style="padding: 1px 7px; border: 2px solid currentColor; border-radius: 3px; font-family: 'Archivo', sans-serif; font-size: 13px; font-weight: 800; transform: rotate(-6deg)">SOLD</span></a></sc-if>
</div>
</div>
<svg aria-hidden="true" width="0" height="0" style="position: absolute; width: 0; height: 0; overflow: hidden"><filter id="ds-grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter></svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1032}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { buyer: 0, dur: 1, active: false }; }
  renderVals() {
    var self = this, s = this.state;
    var B = [['nino.k', '#B07A6E'], ['luka_99', '#6F8FA6'], ['mari.v', '#8E9B6A']];
    var D = [['2 სთ', 'დღეს 20:40', '01:59:48'], ['24 სთ', 'ხვალ 18:40', '23:59:12'], ['48 სთ', 'ზეგ 18:40', '47:59:12']];
    var chip = 'display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 6px;border-radius:999px;font-family:\'JetBrains Mono\',monospace;font-size:13px;font-weight:700;cursor:pointer;';
    return {
      setup: !s.active, active: s.active,
      buyers: B.map(function (b, i) {
        var on = s.buyer === i;
        return { h: '@' + b[0], on: on ? 'true' : 'false', pick: function () { self.setState({ buyer: i }); },
          av: 'width:32px;height:32px;border-radius:999px;background:' + b[1],
          style: chip + (on ? 'border:0;background:#D4FF3A;color:#0E0E0E' : 'border:1px solid #2E2E2B;background:transparent;color:#EDEDE8') };
      }),
      buyerInput: '', buyer: '@' + B[s.buyer][0],
      durs: D.map(function (d, i) {
        var on = s.dur === i;
        return { label: d[0], on: on ? 'true' : 'false', pick: function () { self.setState({ dur: i }); },
          style: 'height:52px;border-radius:12px;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;' + (on ? 'border:0;background:#EDEDE8;color:#0E0E0E' : 'border:1px solid #2E2E2B;background:transparent;color:#A3A39B') };
      }),
      until: D[s.dur][1], left: D[s.dur][2],
      confirm: function () { self.setState({ active: true }); },
      release: function () { self.setState({ active: false }); }
    };
  }
}
</script>
</body>
</html>
