<style>
body{margin:0;background:#0E0E0E}
a{color:#D4FF3A}a:hover{color:#EAFF8F}

.ds-card .ds-ph{transition:transform .5s cubic-bezier(.2,.7,.2,1)}

.ds-sk{animation:ds-pulse 1.4s ease-in-out infinite}

.ds-grained::after{content:"";position:absolute;inset:0;z-index:40;pointer-events:none;opacity:0.22;mix-blend-mode:overlay;filter:url(#ds-grain)}

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 0 }; }
  renderVals() {
    var self = this, st = this.state;
    var shops = [
      { name: 'ძველი კარადა', c: '#C9A27A', x: 30, y: 52, n: 10, dist: '0.4 კმ', hours: '12–20', t: ['#4A2F2A', '#B9B0A2', '#2C363B', '#5B5248'], p: ['220', '60', '45', '260'] },

      { name: 'ფარდული', c: '#B07A6E', x: 58, y: 40, n: 6, dist: '1.1 კმ', hours: '11–19', t: ['#7A6E60', '#B9B0A2', '#3D3A45', '#2F3B2E'], p: ['35', '75', '40', '150'] },
      { name: 'Garage 41', c: '#8E9B6A', x: 70, y: 60, n: 15, dist: '1.6 კმ', hours: '13–21', t: ['#3A332C', '#2C363B', '#1F2326', '#8C8172'], p: ['310', '280', '410', '85'] },
      { name: 'Second Wind', c: '#6F8FA6', x: 20, y: 30, n: 8, dist: '2.0 კმ', hours: '12–20', t: ['#2F3B2E', '#55443A', '#A39783', '#2A2E36'], p: ['345', '90', '55', '85'] },
      { name: 'Mezzanine 7', c: '#9A8FB0', x: 46, y: 22, n: 4, dist: '2.4 კმ', hours: '10–18', t: ['#3D3A45', '#6B5A4C', '#B9B0A2', '#1F2326'], p: ['70', '25', '120', '45'] }
    ];
    function pick(i) { return function () { self.setState({ sel: i }); }; }
    var s = shops[st.sel];
    return {
      savedN: '3',
      list: shops.map(function (x, i) {
        var on = st.sel === i;
        return { name: x.name, dist: x.dist, meta: x.n + ' ITEMS · ' + x.hours, on: on ? 'true' : 'false', pick: pick(i),
          avatar: 'flex-shrink:0;width:44px;height:44px;border-radius:999px;background:' + x.c + (on ? ';box-shadow:0 0 0 2px #171716,0 0 0 4px #D4FF3A' : ''),
          row: 'display:flex;align-items:center;gap:14px;width:100%;padding:12px;border-radius:14px;font-family:inherit;color:#EDEDE8;cursor:pointer;' + (on ? 'border:1px solid #D4FF3A;background:#171716' : 'border:1px solid transparent;background:transparent') };
      }),
      pins: shops.map(function (x, i) {
        var on = st.sel === i;
        return { name: x.name, boost: x.name === 'Garage 41', n: String(x.n), on: on ? 'true' : 'false', pick: pick(i),
          style: 'position:absolute;left:' + x.x + '%;top:' + x.y + '%;transform:translate(-50%,-100%)' + (on ? ' scale(1.2)' : '') + ';display:flex;flex-direction:column;align-items:center;padding:0;border:0;background:transparent;cursor:pointer;z-index:' + (on ? 4 : 2),

      }),
      sel: { name: s.name, avatar: 'background:' + s.c, meta: s.n + ' ITEMS · ' + s.dist + ' · ' + s.hours,
        thumbs: s.t.map(function (c, k) { return { p: s.p[k] + ' ₾', style: 'position:relative;flex:1;aspect-ratio:4/5;border-radius:4px;background:radial-gradient(120% 90% at 28% 18%, rgba(255,255,255,.14), rgba(255,255,255,0) 60%), ' + c }; }) }
    };
  }
}
</script>
