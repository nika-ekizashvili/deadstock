<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Saved items — mobile — EN</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Noto+Sans+Georgian:wdth,wght@62.5..100,100..900&amp;display=swap">
<style>
body{margin:0;background:#0E0E0E}
a{color:#D4FF3A}a:hover{color:#EAFF8F}
:focus-visible{outline:2px solid #D4FF3A !important;outline-offset:3px}
.ds-btn{transition:transform .15s ease,background-color .15s ease,color .15s ease}
.ds-btn:active{transform:scale(.9)}
@media (prefers-reduced-motion:reduce){.ds-btn{transition:none}}
</style>
</helmet>
<div style="position: relative; overflow: hidden; width: 375px; min-height: 1300px; background: #0E0E0E; color: #EDEDE8; font-family: 'Archivo', 'Noto Sans Georgian', system-ui, sans-serif">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #2E2E2B">
<span style="display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 800">
<svg width="22" height="22" viewBox="0 0 24 24" fill="#D4FF3A" stroke="#D4FF3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
Saved</span>
<span style="display: flex; align-items: center; gap: 8px"><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A3A39B">{{count}}</span><a href="Me-375-EN.dc.html" aria-label="Profile" title="Profile" style="width: 40px; height: 40px; margin-right: -6px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #D4FF3A; color: #0E0E0E; text-decoration: none; font-weight: 900; font-size: 16px">N</a></span>
</header>

<div role="group" aria-label="Filter" style="display: flex; gap: 8px; padding: 16px 16px 8px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" class="ds-btn" aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.n}}</button>
</sc-for>
</div>

<div style="margin: 8px 16px 0; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: #171716; border: 1px solid #2E2E2B">
<span style="display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 3px; background: #D4FF3A; color: #0E0E0E; font-size: 12px; font-weight: 800"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"></path></svg>1</span>
<span style="padding: 1px 6px; border: 1.5px solid #EDEDE8; border-radius: 3px; font-size: 10px; font-weight: 800; letter-spacing: 0.06em; transform: rotate(-6deg)">SOLD 1</span>
<span style="display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 999px; background: #D4FF3A; color: #0E0E0E"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h12M6 22h12M7 2v4c0 3 5 4 5 6s-5 3-5 6v4M17 2v4c0 3-5 4-5 6s5 3 5 6v4"></path></svg></span>
<span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #A3A39B">SINCE LAST VISIT</span>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 12px; padding: 20px 16px 120px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; gap: 10px; min-width: 0">
<div style="position: relative; aspect-ratio: 4 / 5; border-radius: 4px; overflow: hidden; {{it.photo}}">
<a href="{{it.href}}" aria-label="{{it.t}}" style="position: absolute; inset: 0"></a>
<button type="button" class="ds-btn" aria-label="Save" aria-pressed="{{it.savedAria}}" onClick="{{it.toggle}}" style="{{it.heartBtn}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="{{it.heartFill}}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg></button>
<sc-if value="{{it.hold}}" hint-placeholder-val="{{ false }}">
<span title="On hold" role="img" aria-label="On hold" style="position: absolute; top: 8px; left: 8px; width: 26px; height: 26px; border-radius: 999px; background: #D4FF3A; color: #0E0E0E; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px rgba(14, 14, 14, 0.5)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h12M6 22h12M7 2v4c0 3 5 4 5 6s-5 3-5 6v4M17 2v4c0 3-5 4-5 6s5 3 5 6v4"></path></svg></span>
</sc-if>
<sc-if value="{{it.sold}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%) rotate(-10deg); padding: 4px 12px; border: 2px solid #EDEDE8; border-radius: 4px; background: rgba(14, 14, 14, 0.4); color: #EDEDE8; font-size: 15px; font-weight: 800; letter-spacing: 0.06em; pointer-events: none">SOLD</span>
</sc-if>
<div style="position: absolute; left: 8px; bottom: 10px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; pointer-events: none">
<sc-if value="{{it.drop}}" hint-placeholder-val="{{ false }}">
<span style="display: inline-flex; align-items: center; gap: 3px; padding: 2px 6px; border-radius: 3px; background: #D4FF3A; color: #0E0E0E; font-size: 11px; font-weight: 800; transform: rotate(-3deg)"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"></path></svg>{{it.dropBy}}</span>
</sc-if>
<span style="{{it.tagStyle}}"><span style="width: 5px; height: 5px; border-radius: 999px; background: #0E0E0E"></span>{{it.price}}</span>
</div>
</div>
<span style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13px; line-height: 18px; font-weight: 500; {{it.titleStyle}}">{{it.t}}</span>
</div>
</sc-for>
</div>

<nav aria-label="Menu" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-around; padding: 8px 8px 26px; background: rgba(14, 14, 14, 0.94); border-top: 1px solid #2E2E2B">
<sc-for list="{{nav}}" as="tb" hint-placeholder-count="5">
<a href="{{tb.href}}" aria-label="{{tb.n}}" title="{{tb.n}}" style="{{tb.style}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{tb.d}}"></path></svg></a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":1300}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 0, unsaved: {} }; }
  renderVals() {
    var self = this, st = this.state;
    var raw = [
      { t: 'Nike Air Max 95', p: 150, was: 190, c: '#2C363B', drop: true, h: 'Item-375-EN.dc.html' },
      { t: 'Pepe Jeans leather jacket', p: 220, c: '#3A332C', hold: true, h: 'Item-375-EN.dc.html' },
      { t: 'Levi’s 501 vintage', p: 120, c: '#5B5248', sold: true, h: 'Item-375-Sold.dc.html' },
      { t: 'ზაფხულის კაბა', p: 35, c: '#B9B0A2', h: 'Item-375-EN.dc.html' },
      { t: 'Carhartt Detroit jacket', p: 310, c: '#4A2F2A', h: 'Item-375-EN.dc.html' },
      { t: 'ნატურალური ტყავის ჩანთა', p: null, c: '#7A6E60', h: 'Item-375-NoPrice.dc.html' }
    ];
    var filtered = raw.filter(function (r) {
      if (st.tab === 1) return !r.sold;
      if (st.tab === 2) return r.drop || r.hold || r.sold;
      return true;
    });
    var tabOn = 'height:40px;padding:0 16px;border:1px solid #EDEDE8;border-radius:999px;background:#EDEDE8;color:#0E0E0E;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer';
    var tabOff = 'height:40px;padding:0 16px;border:1px solid #2E2E2B;border-radius:999px;background:transparent;color:#A3A39B;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer';
    var tabs = ['All', 'Available', 'Changes'].map(function (n, i) {
      return { n: n, on: st.tab === i ? 'true' : 'false', style: st.tab === i ? tabOn : tabOff, pick: function () { self.setState({ tab: i }); } };
    });
    var items = filtered.map(function (r) {
      var saved = !st.unsaved[r.t];
      var tag = "display:inline-flex;align-items:center;gap:6px;padding:5px 9px 5px 7px;border-radius:3px;font-weight:700;font-size:14px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;transform:rotate(-3deg);transform-origin:left bottom;box-shadow:0 2px 0 rgba(0,0,0,.35);";
      tag += r.sold ? 'background:#A3A39B;color:#0E0E0E;text-decoration:line-through' : 'background:#EDEDE8;color:#0E0E0E';
      return {
        t: r.t, href: r.h, hold: !!r.hold, sold: !!r.sold, drop: !!r.drop, dropBy: r.was ? String(r.was - r.p) : '',
        price: r.p != null ? r.p + ' ₾' : '? ₾', tagStyle: tag,
        titleStyle: r.sold ? 'color:#A3A39B' : 'color:#EDEDE8',
        photo: 'background:radial-gradient(120% 90% at 28% 18%, rgba(255,255,255,.14), rgba(255,255,255,0) 60%), ' + r.c + (r.sold ? ';filter:grayscale(1) brightness(.55)' : ''),
        savedAria: saved ? 'true' : 'false', heartFill: saved ? 'currentColor' : 'none',
        heartBtn: 'position:absolute;top:6px;right:6px;width:36px;height:36px;border:0;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer;' + (saved ? 'background:#D4FF3A;color:#0E0E0E' : 'background:rgba(14,14,14,.7);color:#EDEDE8'),
        toggle: function () { var u = Object.assign({}, st.unsaved); u[r.t] = saved; self.setState({ unsaved: u }); }
      };
    });
    var tabBase = 'position:relative;display:flex;align-items:center;justify-content:center;width:56px;height:48px;border-radius:999px;';
    var nav = [
      ['Home', 'M3 11 12 3l9 8v10h-6v-6H9v6H3z', 'Home-375-EN.dc.html'],
      ['Drops', 'M4 6h16v15H4zM4 10h16M8 3v4M16 3v4', 'Drops-375-EN.dc.html'],
      ['Map', 'M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z', 'Map-375-EN.dc.html'],
      ['Saved', 'M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z', 'Saved-375-EN.dc.html'],
      ['Alerts', 'M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4', 'Alerts-375-EN.dc.html']
    ].map(function (t, i) { return { n: t[0], d: t[1], href: t[2], style: tabBase + (i === 3 ? 'background:#D4FF3A;color:#0E0E0E' : 'color:#A3A39B') }; });
    var count = raw.filter(function (r) { return !st.unsaved[r.t]; }).length;
    return { tabs: tabs, items: items, nav: nav, count: String(count) };
  }
}
</script>
</body>
</html>
