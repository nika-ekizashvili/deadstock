<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<title>Shop sign-in — desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Noto+Sans+Georgian:wdth,wght@62.5..100,100..900&amp;display=swap">
<style>
body{margin:0;background:#0E0E0E}
a{color:#D4FF3A}a:hover{color:#EAFF8F}
:focus-visible{outline:2px solid #D4FF3A !important;outline-offset:3px}
.ds-btn{transition:transform .15s ease,background-color .15s ease}
.ds-btn:active{transform:scale(.97)}
.ds-p:hover{background:#E6FF80 !important}
.ds-tile{transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.ds-tiles:hover .ds-tile{transform:translateY(-6px)}
@media (prefers-reduced-motion:reduce){.ds-btn,.ds-tile{transition:none}}
.ds-grained::after{content:"";position:absolute;inset:0;z-index:40;pointer-events:none;opacity:0.22;mix-blend-mode:overlay;filter:url(#ds-grain)}
</style>
</helmet>
<div class="ds-grained" style="position: relative; overflow: hidden; min-height: 900px; display: flex; flex-direction: column; background: #0E0E0E; color: #EDEDE8; font-family: 'Archivo', 'Noto Sans Georgian', system-ui, sans-serif">

<header style="border-bottom: 1px solid #2E2E2B">
<div style="max-width: 1440px; margin: 0 auto; padding: 18px 48px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 16px">
<a href="Home-1440.dc.html" aria-label="DEADSTOCK — მთავარი" style="display: flex; align-items: flex-start; gap: 3px; color: #EDEDE8; text-decoration: none">
<span style="font-weight: 900; font-stretch: 125%; font-size: 22px; line-height: 1; letter-spacing: -0.04em">DEADSTOCK</span>
<span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 11px; color: #D4FF3A">.ge</span>
</a>
<div role="group" aria-label="ენა / Language" style="display: flex; padding: 3px; background: #171716; border: 1px solid #2E2E2B; border-radius: 999px">
<button type="button" aria-pressed="true" style="height: 36px; min-width: 52px; padding: 0 12px; border: 0; border-radius: 999px; background: #EDEDE8; color: #0E0E0E; font-family: inherit; font-size: 13px; font-weight: 700">ქარ</button>
<button type="button" aria-pressed="false" style="height: 36px; min-width: 52px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: #A3A39B; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500">ENG</button>
</div>
</div>
</header>

<main style="flex: 1; width: 100%; max-width: 1440px; margin: 0 auto; padding: 80px 48px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 80px">

<div style="flex: 1 1 440px; max-width: 520px; display: flex; flex-direction: column; gap: 28px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.1em; color: #D4FF3A">SELL ON DEADSTOCK</span>
<h1 style="margin: 0; font-family: 'Noto Sans Georgian', 'Archivo', sans-serif; font-size: 52px; line-height: 62px; font-weight: 800">Instagram დააკავშირე.<br><span style="color: #D4FF3A">დანარჩენს ჩვენ ვიზამთ.</span></h1>
<div style="display: flex; gap: 12px; padding: 16px 18px; border: 1px solid #2E2E2B; border-radius: 12px; background: #171716">
<svg style="flex-shrink: 0; margin-top: 2px" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A3A39B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><path d="M12 8h.01"></path></svg>
<span style="font-size: 15px; line-height: 23px; color: #EDEDE8">მხოლოდ <strong>Business</strong> / <strong>Creator</strong> ანგარიში</span>
</div>
<div style="display: flex; flex-direction: column; gap: 14px">
<a href="Dash-1440.dc.html" class="ds-btn ds-p" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 999px; background: #D4FF3A; color: #0E0E0E; text-decoration: none; font-size: 17px; font-weight: 700">დაკავშირება
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg></a>
<sc-if value="{{showError}}" hint-placeholder-val="{{ false }}">
<p role="alert" style="margin: 0; display: flex; gap: 10px; padding: 12px 14px; border: 1px solid #FF6B4A; border-radius: 12px; font-size: 14px; line-height: 21px; color: #FF6B4A">
<svg style="flex-shrink: 0; margin-top: 1px" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6"></path><path d="M12 16.5h.01"></path></svg>
<span>Business / Creator?</span>
</p>
</sc-if>
</div>
<a href="Home-1440.dc.html" style="align-self: flex-start; font-size: 14px; text-decoration: none; color: #A3A39B">← უკან</a>
</div>

<div aria-hidden="true" class="ds-tiles" style="flex: 1 1 480px; min-width: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="6">
<div class="ds-tile" style="{{t.style}}">
<sc-if value="{{t.tag}}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; left: 10px; bottom: 12px; display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px 6px 8px; border-radius: 3px; background: #EDEDE8; color: #0E0E0E; font-size: 16px; font-weight: 700; line-height: 1; transform: rotate(-3deg); transform-origin: left bottom; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35)"><span style="width: 6px; height: 6px; border-radius: 999px; background: #0E0E0E"></span>{{t.price}}</span>
</sc-if>
</div>
</sc-for>
</div>

</main>
<svg aria-hidden="true" width="0" height="0" style="position: absolute; width: 0; height: 0; overflow: hidden"><filter id="ds-grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter></svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showError":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var tones = ['#3A332C', '#B9B0A2', '#2C363B', '#4A2F2A', '#6B5A4C', '#2F3B2E'];
    var prices = ['', '220 ₾', '', '35 ₾', '', '310 ₾'];
    return {
      showError: this.props.showError ?? false,
      tiles: tones.map(function (t, i) {
        return { style: 'position:relative;aspect-ratio:4/5;border-radius:4px;background:radial-gradient(120% 90% at 28% 18%, rgba(255,255,255,.14), rgba(255,255,255,0) 60%), ' + t + ';opacity:' + (i % 2 ? '1' : '.55') + ';margin-top:' + (i % 3 === 1 ? '32px' : '0'), tag: !!prices[i], price: prices[i] };
      })
    };
  }
}
</script>
</body>
</html>
