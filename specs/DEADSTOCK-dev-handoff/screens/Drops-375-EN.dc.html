<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drop calendar — mobile — EN</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Noto+Sans+Georgian:wdth,wght@62.5..100,100..900&amp;display=swap">
<style>
body{margin:0;background:#0E0E0E}
a{color:#D4FF3A}a:hover{color:#EAFF8F}
:focus-visible{outline:2px solid #D4FF3A !important;outline-offset:3px}
.ds-btn{transition:transform .15s ease,background-color .15s ease,color .15s ease}
.ds-btn:active{transform:scale(.9)}
.ds-pulse{animation:ds-ping 1.6s ease-out infinite}
@keyframes ds-ping{0%{box-shadow:0 0 0 0 rgba(212,255,58,.6)}100%{box-shadow:0 0 0 10px rgba(212,255,58,0)}}
@media (prefers-reduced-motion:reduce){.ds-btn{transition:none}.ds-pulse{animation:none}}
</style>
</helmet>
<div style="position: relative; overflow: hidden; width: 375px; min-height: 1300px; background: #0E0E0E; color: #EDEDE8; font-family: 'Archivo', 'Noto Sans Georgian', system-ui, sans-serif">

<header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #2E2E2B">
<span style="display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 800">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D4FF3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v15H4zM4 10h16M8 3v4M16 3v4"></path></svg>
Drops</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A3A39B">Oct 6–12</span>
</header>

<section style="position: relative; margin: 16px; padding: 22px 20px 20px; border-radius: 18px; background: #D4FF3A; color: #0E0E0E; overflow: hidden; isolation: isolate">
<span aria-hidden="true" style="position: absolute; right: -24px; top: -18px; font-weight: 900; font-stretch: 125%; font-size: 120px; line-height: 1; letter-spacing: -0.06em; color: rgba(14, 14, 14, 0.08); z-index: -1">THU</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.12em">COMMUNITY DROP</span>
<div style="margin-top: 6px; font-weight: 900; font-stretch: 125%; font-size: 30px; line-height: 0.95; letter-spacing: -0.04em">DEADSTOCK<br>THURSDAY</div>
<div style="display: flex; align-items: center; gap: 10px; margin-top: 16px">
<div style="display: flex">
<sc-for list="{{crew}}" as="c" hint-placeholder-count="6">
<span style="{{c.style}}"></span>
</sc-for>
</div>
<span style="font-size: 13px; font-weight: 700">6 shops · 20:00</span>
</div>
<div style="display: flex; align-items: center; gap: 10px; margin-top: 16px">
<span style="flex: 1; display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 999px; background: #0E0E0E; color: #D4FF3A; font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums">2d 14:22:05</span>
<button type="button" class="ds-btn" aria-label="Remind me" aria-pressed="{{remAria}}" title="Remind me" onClick="{{toggleRem}}" style="{{remStyle}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="{{remFill}}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"></path><path d="M10 21h4"></path></svg></button>
</div>
</section>

<div role="group" aria-label="Day" style="display: flex; gap: 6px; padding: 4px 16px 12px; overflow-x: auto">
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<button type="button" class="ds-btn" aria-pressed="{{d.on}}" onClick="{{d.pick}}" style="{{d.style}}"><span style="font-size: 12px">{{d.n}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700">{{d.date}}</span><span style="{{d.dot}}"></span></button>
</sc-for>
</div>

<section style="display: flex; flex-direction: column; gap: 10px; padding: 8px 16px 120px">
<sc-for list="{{drops}}" as="x" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: #171716; {{x.border}}">
<div style="width: 58px; display: flex; flex-direction: column; align-items: center; gap: 2px">
<sc-if value="{{x.live}}" hint-placeholder-val="{{ false }}"><span class="ds-pulse" style="width: 10px; height: 10px; border-radius: 999px; background: #D4FF3A"></span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #D4FF3A">LIVE</span></sc-if>
<sc-if value="{{x.notLive}}" hint-placeholder-val="{{ true }}"><span style="font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 700">{{x.time}}</span></sc-if>
</div>
<span style="flex-shrink: 0; width: 40px; height: 40px; border-radius: 999px; {{x.avatar}}"></span>
<a href="Shop-375-EN.dc.html" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; color: #EDEDE8; text-decoration: none">
<span style="font-size: 15px; font-weight: 700">{{x.shop}}</span>
<span style="display: flex; align-items: center; gap: 5px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #A3A39B"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"></path></svg>~{{x.n}}</span>
</a>
<button type="button" class="ds-btn" aria-label="Remind me" aria-pressed="{{x.on}}" onClick="{{x.toggle}}" style="{{x.style}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="{{x.fill}}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"></path><path d="M10 21h4"></path></svg></button>
</div>
</sc-for>
</section>

<nav aria-label="Menu" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-around; padding: 8px 8px 26px; background: rgba(14, 14, 14, 0.94); border-top: 1px solid #2E2E2B">
<sc-for list="{{nav}}" as="tb" hint-placeholder-count="5">
<a href="{{tb.href}}" aria-label="{{tb.n}}" title="{{tb.n}}" style="{{tb.style}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{tb.d}}"></path></svg></a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":1300}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { day: 0, rem: false, on: { 1: true } }; }
  renderVals() {
    var self = this, st = this.state;
    var crewCols = ['#C9A27A', '#6F8FA6', '#8E9B6A', '#B07A6E', '#7A6E60', '#3D3A45'];
    var crew = crewCols.map(function (c, i) { return { style: 'width:30px;height:30px;border-radius:999px;border:2px solid #D4FF3A;background:' + c + ';margin-left:' + (i ? '-10px' : '0') }; });
    var dayNames = [['Mon', '6', true], ['Tue', '7', false], ['Wed', '8', true], ['Thu', '9', true], ['Fri', '10', false], ['Sat', '11', true], ['Sun', '12', false]];
    var days = dayNames.map(function (d, i) {
      var on = st.day === i;
      return {
        n: d[0], date: d[1], on: on ? 'true' : 'false', pick: function () { self.setState({ day: i }); },
        style: 'flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;width:46px;padding:8px 0;border-radius:14px;cursor:pointer;font-family:inherit;' + (on ? 'border:1px solid #EDEDE8;background:#EDEDE8;color:#0E0E0E' : 'border:1px solid #2E2E2B;background:transparent;color:#EDEDE8'),
        dot: 'width:5px;height:5px;border-radius:999px;background:' + (d[2] ? (on ? '#0E0E0E' : '#D4FF3A') : 'transparent')
      };
    });
    function bell(on) { return 'flex-shrink:0;width:44px;height:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer;' + (on ? 'border:0;background:#D4FF3A;color:#0E0E0E' : 'border:1px solid #2E2E2B;background:transparent;color:#A3A39B'); }
    var drops = [
      { time: 'LIVE', live: true, shop: 'Second Wind', c: '#6F8FA6', n: 8 },
      { time: '20:00', shop: 'ძველი კარადა', c: '#C9A27A', n: 12 },
      { time: '21:30', shop: 'ფარდული', c: '#B07A6E', n: 6 },
      { time: '22:00', shop: 'Garage 41', c: '#8E9B6A', n: 15 }
    ].map(function (x, i) {
      var on = !!st.on[i];
      return {
        time: x.time, live: !!x.live, notLive: !x.live, shop: x.shop, n: String(x.n), avatar: 'background:' + x.c,
        border: x.live ? 'border:1px solid #D4FF3A' : 'border:1px solid transparent',
        on: on ? 'true' : 'false', fill: on ? 'currentColor' : 'none', style: bell(on),
        toggle: function () { var o = Object.assign({}, st.on); o[i] = !o[i]; self.setState({ on: o }); }
      };
    });
    var tabBase = 'position:relative;display:flex;align-items:center;justify-content:center;width:56px;height:48px;border-radius:999px;';
    var nav = [
      ['Home', 'M3 11 12 3l9 8v10h-6v-6H9v6H3z', 'Home-375-EN.dc.html'],
      ['Drops', 'M4 6h16v15H4zM4 10h16M8 3v4M16 3v4', 'Drops-375-EN.dc.html'],
      ['Map', 'M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z', 'Map-375-EN.dc.html'],
      ['Saved', 'M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z', 'Saved-375-EN.dc.html'],
      ['Alerts', 'M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4', 'Alerts-375-EN.dc.html']
    ].map(function (t, i) { return { n: t[0], d: t[1], href: t[2], style: tabBase + (i === 1 ? 'background:#D4FF3A;color:#0E0E0E' : 'color:#A3A39B') }; });
    return {
      crew: crew, days: days, drops: drops, nav: nav,
      remAria: st.rem ? 'true' : 'false', remFill: st.rem ? 'currentColor' : 'none',
      remStyle: 'flex-shrink:0;width:52px;height:52px;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer;' + (st.rem ? 'border:0;background:#0E0E0E;color:#D4FF3A' : 'border:2px solid #0E0E0E;background:transparent;color:#0E0E0E'),
      toggleRem: function () { self.setState({ rem: !st.rem }); }
    };
  }
}
</script>
</body>
</html>
