<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<title>Shop dashboard — mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Noto+Sans+Georgian:wdth,wght@62.5..100,100..900&amp;display=swap">
<style>
body{margin:0;background:#0E0E0E}
a{color:#D4FF3A}a:hover{color:#EAFF8F}
:focus-visible{outline:2px solid #D4FF3A !important;outline-offset:3px}
button{transition:transform .15s ease,background-color .15s ease,border-color .15s ease}
button:active{transform:scale(.97)}
.ds-p:hover{background:#E6FF80 !important}
@media (prefers-reduced-motion:reduce){button{transition:none}}
</style>
</helmet>
<div style="width: 375px; min-height: 2200px; background: #0E0E0E; color: #EDEDE8; font-family: 'Archivo', 'Noto Sans Georgian', system-ui, sans-serif">

<header style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 16px; border-bottom: 1px solid #2E2E2B">
<div style="display: flex; align-items: center; gap: 8px">
<a href="Home-375.dc.html" style="color: #EDEDE8; text-decoration: none; font-weight: 900; font-stretch: 125%; font-size: 17px; letter-spacing: -0.04em">DEADSTOCK</a>
<span style="padding: 2px 6px; border: 1px solid #2E2E2B; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.08em; color: #A3A39B">SHOP</span>
</div>
<div style="display: flex; align-items: center; gap: 6px">
<div role="group" aria-label="ენა / Language" style="display: flex; padding: 2px; background: #171716; border: 1px solid #2E2E2B; border-radius: 999px">
<button type="button" aria-pressed="true" style="height: 40px; min-width: 40px; padding: 0 8px; border: 0; border-radius: 999px; background: #EDEDE8; color: #0E0E0E; font-family: inherit; font-size: 12px; font-weight: 700">ქარ</button>
<button type="button" aria-pressed="false" style="height: 40px; min-width: 40px; padding: 0 8px; border: 0; border-radius: 999px; background: transparent; color: #A3A39B; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 500">ENG</button>
</div>
<a href="Dash-Settings-375.dc.html" aria-label="მაღაზიის პარამეტრები" title="მაღაზიის პარამეტრები" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 1px solid #2E2E2B; border-radius: 999px; color: #EDEDE8"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg></a>
<a href="SignIn-375.dc.html" aria-label="გასვლა" title="გასვლა" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 1px solid #2E2E2B; border-radius: 999px; color: #EDEDE8">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4"></path><path d="M10 8l-4 4 4 4"></path><path d="M6 12h10"></path></svg></a>
</div>
</header>

<main style="display: flex; flex-direction: column; gap: 36px; padding: 20px 16px 64px">

<section style="display: flex; flex-direction: column; gap: 16px; padding: 18px; background: #171716; border: 1px solid #2E2E2B; border-radius: 12px">
<div style="display: flex; align-items: center; gap: 14px; min-width: 0">
<span style="flex-shrink: 0; width: 52px; height: 52px; border-radius: 999px; background: #C9A27A"></span>
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<h1 style="margin: 0; font-family: 'Noto Sans Georgian', 'Archivo', sans-serif; font-size: 21px; line-height: 27px; font-weight: 800">ძველი კარადა</h1>
<a href="Shop-375.dc.html" style="font-family: 'JetBrains Mono', monospace; font-size: 11px; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">dzveli-karada.deadstock.ge ↗</a>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 13px; color: #A3A39B">
<span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: #222220; color: #EDEDE8; font-size: 12px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 999px; background: #D4FF3A"></span>LIVE</span>
12 წთ · 42
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border: 1px solid #EDEDE8; border-radius: 999px; background: transparent; color: #EDEDE8; font-family: inherit; font-size: 13px; font-weight: 600">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.9-3"></path><path d="M4 4v4h4"></path><path d="M4 13a8 8 0 0 0 14.9 3"></path><path d="M20 20v-4h-4"></path></svg>
SYNC</button>
<button type="button" role="switch" aria-checked="{{autoAria}}" onClick="{{toggleAuto}}" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border: 1px solid #2E2E2B; border-radius: 999px; background: transparent; color: #EDEDE8; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">
<span style="{{trackStyle}}"><span style="{{knobStyle}}"></span></span>
AUTO</button>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<a href="Dash-Sync-375.dc.html" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border: 1px solid #FF6B4A; border-radius: 999px; color: #FF6B4A; text-decoration: none; font-size: 13px; font-weight: 700"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 20h20zM12 10v4M12 17h.01"></path></svg>სინქი · 1</a>
<a href="Dash-Drop-375.dc.html" class="ds-p" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: 999px; background: #D4FF3A; color: #0E0E0E; text-decoration: none; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>DROP</a>
</div>
<a href="Dash-Boosts-375.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border: 1px solid #D4FF3A; border-radius: 999px; color: #D4FF3A; text-decoration: none; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg>BOOSTS · 1 LIVE</a>
</section>

<section style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 10px">
<h2 style="margin: 0; font-size: 20px; font-weight: 800">ახალი</h2>
<span style="{{pendingPill}}">{{pendingCount}}</span>
</div>
<span style="font-size: 13px; line-height: 19px; color: #A3A39B">{{queueNote}}</span>
<sc-if value="{{hasPending}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{pending}}" as="it" hint-placeholder-count="3">
<div style="display: flex; gap: 12px; padding: 12px; background: #171716; border: 1px solid #2E2E2B; border-radius: 12px">
<span style="flex-shrink: 0; width: 64px; height: 80px; border-radius: 4px; {{it.thumb}}"></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<a href="Dash-Edit-375.dc.html" style="color: #EDEDE8; text-decoration: none; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{it.title}} ↗</a>
<span style="font-size: 12px; color: #A3A39B">{{it.meta}}</span>
<div style="display: flex; gap: 6px; margin-top: auto">
<button type="button" class="ds-p" onClick="{{it.approve}}" style="flex: 1; height: 44px; border: 0; border-radius: 999px; background: #D4FF3A; color: #0E0E0E; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center" aria-label="დადასტურება" title="დადასტურება"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></button>
<button type="button" onClick="{{it.reject}}" style="flex: 1; height: 44px; border: 1px solid #2E2E2B; border-radius: 999px; background: transparent; color: #EDEDE8; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center" aria-label="უარყოფა" title="უარყოფა"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6 6 18"></path></svg></button>
</div>
</div>
</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{noPending}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 12px; padding: 16px; border: 1px dashed #2E2E2B; border-radius: 12px; font-size: 14px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#D4FF3A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>
ყველაფერი ✓
</div>
</sc-if>
</section>

<section style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: baseline; gap: 10px">
<h2 style="margin: 0; font-size: 20px; font-weight: 800">ყველა</h2>

</div>
<div style="display: flex; flex-direction: column; border-top: 1px solid #2E2E2B">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="9">
<div style="display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid #2E2E2B">
<span style="flex-shrink: 0; width: 48px; height: 60px; border-radius: 4px; {{r.thumb}}"></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<a href="Dash-Edit-375.dc.html" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-decoration: none; font-size: 14px; font-weight: 600; {{r.titleStyle}}">{{r.title}} ↗</a>
<span style="font-size: 12px; color: #A3A39B">{{r.meta}}</span>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
<span style="{{r.statusStyle}}">{{r.status}}</span>
<span style="{{r.reviewStyle}}">{{r.review}}</span>
</div>
</div>
<div style="flex-shrink: 0; display: flex; align-items: center; gap: 6px">
<sc-if value="{{r.canSell}}" hint-placeholder-val="{{ true }}">
<a href="Dash-Boost-375.dc.html" aria-label="BOOST" title="BOOST" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #D4FF3A; border-radius: 999px; background: #171716; color: #D4FF3A"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg></a>
<a href="Dash-Hold-375.dc.html" aria-label="დაჯავშნა" title="დაჯავშნა" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 1px solid #2E2E2B; border-radius: 999px; background: #171716; color: #EDEDE8"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h12M6 22h12M7 2v4c0 3 5 4 5 6s-5 3-5 6v4M17 2v4c0 3-5 4-5 6s5 3 5 6v4"></path></svg></a>
<button type="button" onClick="{{r.markSold}}" style="height: 44px; padding: 0 12px; border: 1px solid #2E2E2B; border-radius: 999px; background: #171716; color: #EDEDE8; font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; min-width: 56px" aria-label="გაყიდულად მონიშვნა" title="გაყიდულად მონიშვნა"><span aria-hidden="true" style="padding: 1px 6px; border: 1.5px solid currentColor; border-radius: 3px; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; transform: rotate(-6deg)">SOLD</span></button>
</sc-if>
</div>
</div>
</sc-for>
</div>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":2200}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { auto: false, review: { 1: 'pending', 2: 'pending', 3: 'pending', 6: 'rejected' }, sold: { 9: true } };
  }
  renderVals() {
    var self = this;
    var s = this.state;
    var badge = 'display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;box-sizing:border-box;';
    var reviewMap = {
      pending: { t: 'NEW', st: badge + 'border:1px dashed #A3A39B;color:#EDEDE8' },
      approved: { t: '✓', st: badge + 'padding:0;color:#A3A39B' },
      rejected: { t: '✕', st: badge + 'border:1px solid #FF6B4A;color:#FF6B4A' }
    };
    var statusMap = {
      available: { t: 'LIVE', st: badge + 'background:#222220;color:#EDEDE8' },
      reserved: { t: 'HOLD', st: badge + 'border:1px solid #D4FF3A;color:#D4FF3A' },
      sold: { t: 'SOLD', st: badge + 'background:#EDEDE8;color:#0E0E0E;font-weight:800;letter-spacing:.06em' }
    };
    var tones = ['#3A332C', '#B9B0A2', '#2C363B', '#4A2F2A', '#6B5A4C', '#2F3B2E', '#5B5248', '#8C8172', '#3D3A45', '#7A6E60'];
    var raw = [
      { id: 1, t: 'Wrangler denim jacket', p: 140, s: 'M', st: 'available' },
      { id: 2, t: 'აბრეშუმის შარფი', p: 25, s: '', st: 'available' },
      { id: 3, t: '', b: 'Nike', c: 'მაისურები', p: 50, s: 'L', st: 'available' },
      { id: 4, t: 'Pepe Jeans leather jacket', p: 220, s: 'XS', st: 'reserved' },
      { id: 5, t: 'მატყლის სვიტერი, ხელნაქსოვი', p: 60, s: 'S', st: 'available' },
      { id: 6, t: 'გამარჯობა! ახალი კოლექცია ორშაბათს!', p: null, s: '', st: 'available' },
      { id: 7, t: 'Dr. Martens 1460', p: 260, s: '39', st: 'available' },
      { id: 8, t: 'ტყავის ქამარი', p: null, s: '', st: 'available' },
      { id: 9, t: 'Levi’s 501 vintage', p: 120, s: 'W32 L32', st: 'available' }
    ];
    function setReview(id, v) { var r = Object.assign({}, s.review); r[id] = v; self.setState({ review: r }); }
    var rows = raw.map(function (r, i) {
      var review = s.review[r.id] || 'approved';
      var status = s.sold[r.id] ? 'sold' : r.st;
      return {
        title: r.t || [r.b, r.c].filter(Boolean).join(' · ') || 'უსათაურო',
        titleStyle: r.t ? 'color:#EDEDE8' : 'color:#A3A39B',
        meta: [r.p != null ? r.p + ' ₾' : 'ფასი —', r.s ? 'ზომა ' + r.s : null].filter(Boolean).join(' · '),
        thumb: 'background:' + tones[i % tones.length] + (status === 'sold' ? ';filter:grayscale(1);opacity:.4' : ''),
        status: statusMap[status].t, statusStyle: statusMap[status].st,
        review: reviewMap[review].t, reviewStyle: reviewMap[review].st,
        isPending: review === 'pending',
        canSell: status !== 'sold' && review === 'approved',
        approve: function () { setReview(r.id, 'approved'); },
        reject: function () { setReview(r.id, 'rejected'); },
        markSold: function () { var x = Object.assign({}, s.sold); x[r.id] = true; self.setState({ sold: x }); }
      };
    });
    var pending = rows.filter(function (r) { return r.isPending; });
    var n = pending.length;
    return {
      rows: rows,
      pending: pending,
      pendingCount: String(n),
      hasPending: n > 0,
      noPending: n === 0,
      pendingPill: 'display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 8px;box-sizing:border-box;border-radius:999px;font-size:13px;font-weight:700;' + (n ? 'background:#D4FF3A;color:#0E0E0E' : 'background:#222220;color:#A3A39B'),
      queueNote: s.auto ? '' : '',
      autoAria: s.auto ? 'true' : 'false',
      autoLabel: s.auto ? 'ჩართ.' : 'გამორთ.',
      trackStyle: 'position:relative;display:block;width:36px;height:22px;border-radius:999px;' + (s.auto ? 'background:#D4FF3A' : 'background:#2E2E2B'),
      knobStyle: 'position:absolute;top:3px;width:16px;height:16px;border-radius:999px;' + (s.auto ? 'left:17px;background:#0E0E0E' : 'left:3px;background:#EDEDE8'),
      toggleAuto: function () { self.setState({ auto: !s.auto }); }
    };
  }
}
</script>
</body>
</html>
