      savedN: String(Object.keys(s.saved).filter(function (k) { return s.saved[k]; }).length + 2),

      alertBtn: "display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 18px;border-radius:999px;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;letter-spacing:.04em;cursor:pointer;" + (al ? 'border:0;background:#D4FF3A;color:#0E0E0E' : 'border:1px solid #EDEDE8;background:transparent;color:#EDEDE8'),
      toggleAlert: function () { self.setState({ alert: !al }); }
    };
  }
}
</script>
</body>
</html>
