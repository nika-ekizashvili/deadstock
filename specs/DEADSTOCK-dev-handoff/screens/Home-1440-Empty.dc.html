<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { removed: {}, saved: {}, alert: false }; }
  renderVals() {
    var self = this;
    var all = [{ id: 'cat', label: 'ფეხსაცმელი' }, { id: 'size', label: 'ზომა 38' }, { id: 'price', label: 'მაქს. 100 ₾' }];
    var filters = all.filter(function (f) { return !self.state.removed[f.id]; }).map(function (f) {
      return { label: f.label, aria: 'მოხსნა: ' + f.label, remove: function () { var r = Object.assign({}, self.state.removed); r[f.id] = true; self.setState({ removed: r }); } };
    });
    var tones = ['#4A2F2A', '#B9B0A2', '#2C363B', '#6B5A4C', '#3A332C'];
    var shops = { 'ძველი კარადა': '#C9A27A', 'Second Wind': '#6F8FA6', 'Garage 41': '#8E9B6A', 'ფარდული': '#B07A6E' };
    var raw = [
      { t: 'Dr. Martens 1460', p: 260, s: '39', sh: 'ძველი კარადა' },
      { t: 'ზაფხულის კაბა', p: 35, s: 'M', sh: 'ფარდული' },
      { t: 'Carhartt Detroit jacket', p: 310, s: 'L', sh: 'Garage 41' },
      { t: 'Nike Air Max 95', p: 280, s: '42', sh: 'Garage 41' },
      { t: 'Dickies 874 work pants', p: 85, s: 'W34', sh: 'Second Wind' }
    ];
    var items = raw.map(function (r, i) {
      return {
        title: r.t, size: r.s, shop: r.sh, avatar: 'background:' + shops[r.sh],
        tagText: r.p + ' ₾',
        tagStyle: "position:absolute;left:10px;bottom:12px;display:inline-flex;align-items:center;gap:7px;padding:6px 11px 6px 8px;border-radius:3px;font-family:Archivo,'Noto Sans Georgian',sans-serif;font-weight:700;font-size:16px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap;transform:rotate(-3deg);transform-origin:left bottom;box-shadow:0 2px 0 rgba(0,0,0,.35);background:#EDEDE8;color:#0E0E0E",
        photo: 'position:absolute;inset:0;background:radial-gradient(120% 90% at 28% 18%, rgba(255,255,255,.14), rgba(255,255,255,0) 60%), ' + tones[i],
        savedAria: self.state.saved[i] ? 'true' : 'false',
        heartFill: self.state.saved[i] ? 'currentColor' : 'none',
        heartBtn: 'position:absolute;top:8px;right:8px;width:40px;height:40px;border:0;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer;' + (self.state.saved[i] ? 'background:#D4FF3A;color:#0E0E0E' : 'background:rgba(14,14,14,.7);color:#EDEDE8'),
        toggleSave: function () { var s = Object.assign({}, self.state.saved); s[i] = !s[i]; self.setState({ saved: s }); }
      };
    });
    var al = self.state.alert;
    var savedN = String(Object.keys(self.state.saved).filter(function (k) { return self.state.saved[k]; }).length);
    return { savedN: savedN,
      alertAria: al ? 'true' : 'false', alertFill: al ? 'currentColor' : 'none', alertText: al ? 'ALERT ON' : 'ALERT ME',
      alertBtn: "display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 24px;border-radius:999px;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;letter-spacing:.04em;cursor:pointer;" + (al ? 'border:1px solid #D4FF3A;background:transparent;color:#D4FF3A' : 'border:1px solid #EDEDE8;background:transparent;color:#EDEDE8'),
      toggleAlert: function () { self.setState({ alert: !al }); },
      filters: filters, items: items, resultNote: filters.length ? 'ვერაფერი მოიძებნა' : 'ჯერ არაფერია' };
  }
}
</script>
