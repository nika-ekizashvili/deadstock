<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<title>Dashboard — sync problems — mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Noto+Sans+Georgian:wdth,wght@62.5..100,100..900&amp;display=swap">
<style>
body{margin:0;background:#0E0E0E}
a{color:#D4FF3A}a:hover{color:#EAFF8F}
:focus-visible{outline:2px solid #D4FF3A !important;outline-offset:3px}
.ds-btn{transition:transform .15s ease,background-color .15s ease,border-color .15s ease}
.ds-btn:active{transform:scale(.97)}
.ds-p:hover{background:#E6FF80 !important}
.ds-s:hover{border-color:#EDEDE8 !important;background:#222220 !important}
input::placeholder{color:#6E6E68}
@media (prefers-reduced-motion:reduce){.ds-btn{transition:none}}
.ds-grained::after{content:"";position:absolute;inset:0;z-index:40;pointer-events:none;opacity:0.22;mix-blend-mode:overlay;filter:url(#ds-grain)}
</style>
</helmet>
<div class="ds-grained" style="position: relative; overflow: hidden; width: 375px; min-height: 900px; display: flex; flex-direction: column; background: #0E0E0E; color: #EDEDE8; font-family: 'Archivo', 'Noto Sans Georgian', system-ui, sans-serif">
<header style="display: flex; align-items: center; gap: 8px; padding: 8px 12px 8px 6px; border-bottom: 1px solid #2E2E2B">
<a href="Dash-375.dc.html" aria-label="უკან" title="უკან" style="flex-shrink: 0; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #EDEDE8"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg></a>
<h1 style="flex: 1; min-width: 0; margin: 0; font-family: 'Noto Sans Georgian', 'Archivo', sans-serif; font-size: 18px; font-weight: 800">სინქი</h1>

</header>
<main style="display: flex; flex-direction: column; gap: 22px; padding: 20px 16px 48px">
<sc-if value="{{broken}}" hint-placeholder-val="{{ true }}">
<div role="alert" style="display: flex; flex-direction: column; gap: 14px; padding: 18px; border: 1px solid #FF6B4A; border-radius: 14px; background: rgba(255, 107, 74, 0.08)">
<span style="display: flex; align-items: center; gap: 10px; color: #FF6B4A; font-size: 17px; font-weight: 800"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 20h20zM12 10v4M12 17h.01"></path></svg>IG კავშირი გაწყდა</span>
<span style="font-size: 14px; line-height: 21px; color: #EDEDE8">3 დღე</span>
<button type="button" class="ds-btn ds-p" onClick="{{fix}}" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; border: 0; border-radius: 999px; background: #D4FF3A; color: #0E0E0E; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; letter-spacing: 0.04em; cursor: pointer">RECONNECT<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3M20 4v5h-5M20 12a8 8 0 0 1-14 5.3M4 20v-5h5"></path></svg></button>
</div>
</sc-if>
<sc-if value="{{ok}}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; align-items: center; gap: 12px; padding: 16px 18px; border: 1px solid #D4FF3A; border-radius: 14px; background: rgba(212, 255, 58, 0.06)">
<span style="width: 32px; height: 32px; border-radius: 999px; background: #D4FF3A; color: #0E0E0E; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span>
<span style="flex: 1; font-size: 15px; font-weight: 700">დაკავშირებულია</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A3A39B">ახლა</span>
</div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.1em; color: #A3A39B">IG-ზე წაიშალა · 2</span>
<sc-for list="{{deleted}}" as="d" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 12px; background: #171716">
<span style="{{d.thumb}}"></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{d.title}}</span><span style="font-size: 12px; color: #A3A39B">{{d.state}}</span></span>
<button type="button" class="ds-btn ds-s" aria-pressed="{{d.keepAria}}" onClick="{{d.toggle}}" style="{{d.btn}}">{{d.btnText}}</button>
</div>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.1em; color: #A3A39B">ისტორია</span>
<div style="display: flex; flex-direction: column; border-top: 1px solid #2E2E2B">
<sc-for list="{{log}}" as="l" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #2E2E2B; font-size: 14px">
<span style="{{l.dot}}"></span>
<span style="flex: 1; min-width: 0">{{l.text}}</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A3A39B">{{l.when}}</span>
</div>
</sc-for>
</div>
</div>
</main>
<svg aria-hidden="true" width="0" height="0" style="position: absolute; width: 0; height: 0; overflow: hidden"><filter id="ds-grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter></svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { fixed: false, keep: {} }; }
  renderVals() {
    var self = this, s = this.state;
    var D = [['Barbour wax jacket', '#2F3B2E'], ['ვინტაჟური ჩანთა', '#6B5A4C']];
    var L = s.fixed
      ? [['ok', '+4 ახალი პოსტი', 'ახლა'], ['err', 'ტოკენს ვადა გაუვიდა', '3 დღე'], ['ok', '+2 ახალი პოსტი', '4 დღე'], ['ok', '1 ნივთი → SOLD', '5 დღე']]
      : [['err', 'ტოკენს ვადა გაუვიდა', '3 დღე'], ['ok', '+2 ახალი პოსტი', '4 დღე'], ['ok', '1 ნივთი → SOLD', '5 დღე'], ['ok', '+7 ახალი პოსტი', '6 დღე']];
    return {
      broken: !s.fixed, ok: s.fixed,
      fix: function () { self.setState({ fixed: true }); },
      deleted: D.map(function (d, i) {
        var k = !!s.keep[i];
        return { title: d[0], state: k ? 'ჩანს' : 'დამალული',
          thumb: 'flex-shrink:0;width:48px;aspect-ratio:4/5;border-radius:4px;background:' + d[1] + (k ? '' : ';filter:grayscale(1) brightness(.5)'),
          keepAria: k ? 'true' : 'false', btnText: k ? 'HIDE' : 'KEEP',
          toggle: function () { var o = Object.assign({}, s.keep); o[i] = !k; self.setState({ keep: o }); },
          btn: "flex-shrink:0;height:40px;padding:0 14px;border:1px solid #2E2E2B;border-radius:999px;background:transparent;color:#EDEDE8;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;cursor:pointer" };
      }),
      log: L.map(function (l) { return { text: l[1], when: l[2], dot: 'flex-shrink:0;width:8px;height:8px;border-radius:999px;background:' + (l[0] === 'ok' ? '#D4FF3A' : '#FF6B4A') }; })
    };
  }
}
</script>
</body>
</html>
