<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thrift map — mobile — EN</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Noto+Sans+Georgian:wdth,wght@62.5..100,100..900&amp;display=swap">
<style>
body{margin:0;background:#0E0E0E}
a{color:#D4FF3A}a:hover{color:#EAFF8F}
:focus-visible{outline:2px solid #D4FF3A !important;outline-offset:3px}
.ds-pin{transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.ds-pin:hover{transform:translate(-50%,-100%) scale(1.12) !important}
.ds-btn{transition:transform .15s ease}
.ds-btn:active{transform:scale(.92)}
@media (prefers-reduced-motion:reduce){.ds-pin,.ds-btn{transition:none}}
</style>
</helmet>
<div style="position: relative; overflow: hidden; width: 375px; height: 812px; background: #121211; color: #EDEDE8; font-family: 'Archivo', 'Noto Sans Georgian', system-ui, sans-serif">

<svg aria-hidden="true" width="375" height="812" viewBox="0 0 375 812" style="position: absolute; inset: 0">
<path d="M-20 120 L400 40 M-20 260 L400 300 M-20 420 L400 380 M-20 560 L400 620 M60 -10 L120 820 M200 -10 L170 820 M310 -10 L330 820 M-20 700 L400 720" stroke="#1C1C1B" stroke-width="10" fill="none"></path>
<path d="M-20 200 L400 180 M-20 340 L400 470 M30 -10 L260 820 M250 -10 L60 820" stroke="#191918" stroke-width="5" fill="none"></path>
<path d="M-30 520 C 60 470, 110 380, 170 330 S 260 210, 300 140 S 360 40, 420 0" stroke="#1D272A" stroke-width="22" fill="none" stroke-linecap="round"></path>
<rect x="210" y="430" width="90" height="70" rx="10" fill="#161D16"></rect>
<rect x="30" y="610" width="70" height="60" rx="10" fill="#161D16"></rect>
</svg>

<div style="position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; z-index: 5">
<a href="Home-375-EN.dc.html" aria-label="Back" title="Back" style="flex-shrink: 0; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: rgba(14, 14, 14, 0.9); border: 1px solid #2E2E2B; color: #EDEDE8"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg></a>
<div style="flex: 1; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 16px; border-radius: 999px; background: rgba(14, 14, 14, 0.9); border: 1px solid #2E2E2B">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D4FF3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path></svg>
<span style="font-size: 15px; font-weight: 700">Thrift crawl</span>
<span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A3A39B">6</span>
</div>
</div>

<sc-for list="{{pins}}" as="p" hint-placeholder-count="6">
<button type="button" class="ds-pin" aria-label="{{p.name}}" title="{{p.name}}" aria-pressed="{{p.on}}" onClick="{{p.pick}}" style="{{p.style}}">
<span style="{{p.head}}">{{p.n}}</span>
<sc-if value="{{p.boost}}" hint-placeholder-val="{{ false }}"><span title="BOOST" style="position: absolute; top: -8px; right: -8px; width: 20px; height: 20px; border-radius: 999px; background: #D4FF3A; color: #0E0E0E; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #121211"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg></span></sc-if>
<span style="{{p.tail}}"></span>
</button>
</sc-for>

<span aria-label="You are here" title="You are here" style="position: absolute; left: 150px; top: 470px; width: 18px; height: 18px; border-radius: 999px; background: #EDEDE8; box-shadow: 0 0 0 6px rgba(237, 237, 232, 0.18)"></span>

<div style="position: absolute; left: 12px; right: 12px; bottom: 24px; display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: 20px; background: #171716; border: 1px solid #2E2E2B; box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5); z-index: 6">
<div style="display: flex; align-items: center; gap: 12px">
<span style="flex-shrink: 0; width: 52px; height: 52px; border-radius: 999px; {{sel.avatar}}; box-shadow: 0 0 0 3px #171716, 0 0 0 5px #D4FF3A"></span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 17px; font-weight: 800">{{sel.name}}</span>
<span style="display: flex; align-items: center; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A3A39B">
<span style="display: inline-flex; align-items: center; gap: 4px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"></path></svg>{{sel.n}}</span>
<span>{{sel.dist}}</span>
<span>{{sel.hours}}</span>
</span>
</div>
</div>
<div style="display: flex; gap: 8px">
<sc-for list="{{sel.thumbs}}" as="t" hint-placeholder-count="4">
<span style="{{t.style}}"><span style="position: absolute; left: 4px; bottom: 5px; padding: 2px 5px; border-radius: 2px; background: #EDEDE8; color: #0E0E0E; font-size: 10px; font-weight: 700; transform: rotate(-3deg)">{{t.p}}</span></span>
</sc-for>
</div>
<div style="display: flex; gap: 8px">
<a href="Shop-375-EN.dc.html" class="ds-btn" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; border-radius: 999px; background: #D4FF3A; color: #0E0E0E; text-decoration: none; font-size: 16px; font-weight: 800"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h16l-1.5-5h-13z"></path><path d="M5 9v11h14V9"></path><path d="M10 20v-6h4v6"></path></svg>Shop</a>
<a href="https://maps.google.com/" class="ds-btn" aria-label="Directions" title="Directions" style="flex-shrink: 0; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 999px; border: 1px solid #2E2E2B; color: #EDEDE8"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 11 18-8-8 18-2-8z"></path></svg></a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 0 }; }
  renderVals() {
    var self = this, st = this.state;
    var shops = [
      { name: 'ძველი კარადა', c: '#C9A27A', x: 120, y: 380, n: 10, dist: '0.4 km', hours: '12–20', t: ['#4A2F2A', '#B9B0A2', '#2C363B', '#5B5248'], p: ['220', '60', '45', '260'] },
      { name: 'ფარდული', c: '#B07A6E', x: 245, y: 300, n: 6, dist: '1.1 km', hours: '11–19', t: ['#7A6E60', '#B9B0A2', '#3D3A45', '#2F3B2E'], p: ['35', '75', '40', '150'] },
      { name: 'Garage 41', c: '#8E9B6A', x: 290, y: 420, n: 15, dist: '1.6 km', hours: '13–21', t: ['#3A332C', '#2C363B', '#1F2326', '#8C8172'], p: ['310', '280', '410', '85'] },
      { name: 'Second Wind', c: '#6F8FA6', x: 80, y: 230, n: 8, dist: '2.0 km', hours: '12–20', t: ['#2F3B2E', '#55443A', '#A39783', '#2A2E36'], p: ['345', '90', '55', '85'] },
      { name: 'Mezzanine 7', c: '#9A8FB0', x: 200, y: 180, n: 4, dist: '2.4 km', hours: '10–18', t: ['#3D3A45', '#6B5A4C', '#B9B0A2', '#1F2326'], p: ['70', '25', '120', '45'] },
      { name: 'Vinyl Basement', c: '#5E7D6A', x: 60, y: 540, n: 21, dist: '0.9 km', hours: '14–22', t: ['#1F2326', '#2A2E36', '#3A332C', '#55443A'], p: ['40', '60', '35', '80'] }
    ];
    var pins = shops.map(function (s, i) {
      var on = st.sel === i;
      return {
        name: s.name, boost: s.name === 'Garage 41', n: String(s.n), on: on ? 'true' : 'false', pick: function () { self.setState({ sel: i }); },
        style: 'position:absolute;left:' + s.x + 'px;top:' + s.y + 'px;transform:translate(-50%,-100%)' + (on ? ' scale(1.15)' : '') + ';display:flex;flex-direction:column;align-items:center;padding:0;border:0;background:transparent;cursor:pointer;z-index:' + (on ? 4 : 2),
        head: 'display:flex;align-items:center;justify-content:center;min-width:36px;height:36px;padding:0 8px;box-sizing:border-box;border-radius:999px;font-family:JetBrains Mono,monospace;font-size:13px;font-weight:700;' + (on ? 'background:#D4FF3A;color:#0E0E0E;box-shadow:0 0 0 4px rgba(212,255,58,.25)' : 'background:#0E0E0E;color:#D4FF3A;border:2px solid #D4FF3A'),
        tail: 'width:2px;height:10px;background:#D4FF3A'
      };
    });
    var s = shops[st.sel];
    return {
      pins: pins,
      sel: {
        name: s.name, avatar: 'background:' + s.c, n: String(s.n), dist: s.dist, hours: s.hours,
        thumbs: s.t.map(function (c, k) { return { p: s.p[k] + ' ₾', style: 'position:relative;flex:1;aspect-ratio:4/5;border-radius:4px;background:radial-gradient(120% 90% at 28% 18%, rgba(255,255,255,.14), rgba(255,255,255,0) 60%), ' + c }; })
      }
    };
  }
}
</script>
</body>
</html>
