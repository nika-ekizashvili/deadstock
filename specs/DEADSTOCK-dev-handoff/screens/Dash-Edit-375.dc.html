<title>Dashboard — edit item — mobile</title>

</head>

<x-dc>

<style>
body{margin:0;background:#0E0E0E}
a{color:#D4FF3A}a:hover{color:#EAFF8F}
:focus-visible{outline:2px solid #D4FF3A !important;outline-offset:3px}
.ds-btn{transition:transform .15s ease,background-color .15s ease,border-color .15s ease}
.ds-btn:active{transform:scale(.97)}
.ds-p:hover{background:#E6FF80 !important}
.ds-s:hover{border-color:#EDEDE8 !important;background:#222220 !important}
input::placeholder{color:#6E6E68}
@media (prefers-reduced-motion:reduce){.ds-btn{transition:none}}
.ds-grained::after{content:"";position:absolute;inset:0;z-index:40;pointer-events:none;opacity:0.22;mix-blend-mode:overlay;filter:url(#ds-grain)}
</style>
</helmet>

<a href="Dash-375.dc.html" aria-label="უკან" title="უკან" style="flex-shrink: 0; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #EDEDE8"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg></a>

</div>

</div>

<span style="display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 14px; border-radius: 4px; background: #EDEDE8; color: #0E0E0E; transform: rotate(-2deg); box-shadow: 0 3px 0 rgba(0, 0, 0, 0.4)"><input inputmode="numeric" value="220" style="width: 64px; border: 0; outline: 0; background: transparent; color: inherit; font-family: 'Archivo', sans-serif; font-size: 26px; font-weight: 800; text-align: right"><span style="font-size: 22px; font-weight: 800">₾</span></span></label>
<span style="display: flex; align-items: center; gap: 6px; padding-bottom: 16px; font-size: 13px; color: #A3A39B"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #D4FF3A"><path d="M12 5v14M5 12l7 7 7-7"></path></svg>6 ALERTS</span>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.1em; color: #A3A39B">SIZE</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{sizes}}" as="z" hint-placeholder-count="6">
<button type="button" aria-pressed="{{z.on}}" onClick="{{z.pick}}" style="{{z.style}}">{{z.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.1em; color: #A3A39B">CONDITION</span>

</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">

<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{cats}}" as="k" hint-placeholder-count="12">
<button type="button" aria-pressed="{{k.on}}" aria-label="{{k.name}}" title="{{k.name}}" onClick="{{k.pick}}" style="{{k.style}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{k.icon}}"></path></svg></button>
</sc-for>
</div>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 18px; border-top: 1px solid #2E2E2B">
<a href="https://www.instagram.com/" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; font-weight: 600; text-decoration: none">IG პოსტი <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg></a>
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 4px; border: 0; background: transparent; color: #FF6B4A; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>წაშლა</button>
</div>
</main>

</div>
</x-dc>
