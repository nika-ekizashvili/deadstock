<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shopper log-in sheet — mobile — EN</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Noto+Sans+Georgian:wdth,wght@62.5..100,100..900&amp;display=swap">
<style>
body{margin:0;background:#0E0E0E}
a{color:#D4FF3A}a:hover{color:#EAFF8F}
:focus-visible{outline:2px solid #D4FF3A !important;outline-offset:3px}
.ds-btn{transition:transform .15s ease,background-color .15s ease,border-color .15s ease}
.ds-btn:active{transform:scale(.97)}
.ds-p:hover{background:#E6FF80 !important}
.ds-s:hover{border-color:#EDEDE8 !important;background:#222220 !important}
input::placeholder{color:#6E6E68}
@media (prefers-reduced-motion:reduce){.ds-btn{transition:none}}
.ds-grained::after{content:"";position:absolute;inset:0;z-index:40;pointer-events:none;opacity:0.22;mix-blend-mode:overlay;filter:url(#ds-grain)}
</style>
</helmet>
<div class="ds-grained" style="position: relative; overflow: hidden; width: 375px; min-height: 812px; display: flex; flex-direction: column; background: #0E0E0E; color: #EDEDE8; font-family: 'Archivo', 'Noto Sans Georgian', system-ui, sans-serif">
<div aria-hidden="true" style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 70px 16px 0; filter: blur(3px) brightness(.45)">
<sc-for list="{{bg}}" as="b" hint-placeholder-count="6"><div style="{{b.style}}"></div></sc-for>
</div>
<div role="dialog" aria-modal="true" aria-labelledby="auth-title" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; flex-direction: column; gap: 18px; padding: 10px 20px 32px; background: #171716; border-top: 1px solid #2E2E2B; border-radius: 22px 22px 0 0">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: #2E2E2B"></span>
<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
<span style="width: 52px; height: 52px; border-radius: 999px; background: #D4FF3A; color: #0E0E0E; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg></span>
<a href="Home-375-EN.dc.html" aria-label="Close" title="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #222220; color: #EDEDE8"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
</div>
<h2 id="auth-title" style="margin: 0; font-family: 'Noto Sans Georgian', 'Archivo', sans-serif; font-size: 26px; line-height: 33px; font-weight: 800">Log in &amp;<br><span style="color: #D4FF3A">won't miss a thing.</span></h2>
<div style="display: flex; gap: 14px; color: #A3A39B">
<span title="Saved" style="display: flex; align-items: center; gap: 6px; font-size: 13px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>save</span>
<span title="Alerts" style="display: flex; align-items: center; gap: 6px; font-size: 13px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"></path></svg>alerts</span>
<span title="Follow" style="display: flex; align-items: center; gap: 6px; font-size: 13px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>follow</span>
</div>

<sc-if value="{{isPhone}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 10px">
<label style="display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 6px 0 16px; background: #0E0E0E; border: 1px solid #2E2E2B; border-radius: 999px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #A3A39B">+995</span><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Phone</span>
<input type="tel" inputmode="tel" value="5XX XX XX 12" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #EDEDE8; font-family: inherit; font-size: 16px; font-family: 'JetBrains Mono', monospace">
<button type="button" class="ds-btn ds-p" onClick="{{sendCode}}" aria-label="Send code" style="flex-shrink: 0; width: 44px; height: 44px; border: 0; border-radius: 999px; background: #D4FF3A; color: #0E0E0E; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</label>
<div style="display: flex; align-items: center; gap: 12px; color: #6E6E68; font-family: 'JetBrains Mono', monospace; font-size: 11px"><span style="flex: 1; height: 1px; background: #2E2E2B"></span>OR<span style="flex: 1; height: 1px; background: #2E2E2B"></span></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<a href="Home-375-EN.dc.html" class="ds-btn" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; border-radius: 999px; background: #EDEDE8; color: #0E0E0E; text-decoration: none; font-size: 15px; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M20 12h-8M19.5 8A8 8 0 1 0 20 12"></path></svg>Google</a>
<a href="Home-375-EN.dc.html" class="ds-btn ds-s" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 52px; border: 1px solid #2E2E2B; border-radius: 999px; color: #EDEDE8; text-decoration: none; font-size: 15px; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle></svg>Instagram</a>
</div>
</div>
</sc-if>

<sc-if value="{{isCode}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 14px; color: #A3A39B">SMS → <span style="font-family: 'JetBrains Mono', monospace; color: #EDEDE8">+995 5XX XX XX 12</span></span>
<div role="group" aria-label="6-digit code" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{digits}}" as="d" hint-placeholder-count="6">
<input inputmode="numeric" maxlength="1" aria-label="{{d.aria}}" value="{{d.v}}" style="{{d.style}}">
</sc-for>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<button type="button" onClick="{{backToPhone}}" style="min-height: 44px; padding: 0; border: 0; background: transparent; color: #A3A39B; font-family: inherit; font-size: 14px; cursor: pointer">← Number</button>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #6E6E68">0:42</span>
</div>
<a href="Saved-375-EN.dc.html" class="ds-btn ds-p" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border-radius: 999px; background: #D4FF3A; color: #0E0E0E; text-decoration: none; font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; letter-spacing: 0.04em; flex: none">OK<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></a>
</div>
</sc-if>
</div>
<svg aria-hidden="true" width="0" height="0" style="position: absolute; width: 0; height: 0; overflow: hidden"><filter id="ds-grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter></svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { step: 'phone' }; }
  renderVals() {
    var self = this, code = this.state.step === 'code';
    var tones = ['#3A332C', '#B9B0A2', '#2C363B', '#4A2F2A', '#6B5A4C', '#2F3B2E'];
    var v = ['4', '8', '1', '', '', ''];
    return {
      bg: tones.map(function (t) { return { style: 'aspect-ratio:4/5;border-radius:4px;background:' + t }; }),
      isPhone: !code, isCode: code,
      sendCode: function () { self.setState({ step: 'code' }); },
      backToPhone: function () { self.setState({ step: 'phone' }); },
      digits: v.map(function (d, i) {
        var cur = i === 3;
        return { v: d, aria: 'Digit ' + (i + 1),
          style: "width:100%;box-sizing:border-box;height:56px;border-radius:12px;background:#0E0E0E;color:#EDEDE8;text-align:center;font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;outline:0;border:" + (cur ? '2px solid #D4FF3A' : '1px solid #2E2E2B') };
      })
    };
  }
}
</script>
</body>
</html>
