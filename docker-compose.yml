services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: deadstock
      POSTGRES_PASSWORD: deadstock
      POSTGRES_DB: deadstock
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deadstock"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: deadstock
      MINIO_ROOT_PASSWORD: deadstock-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  # Creates the bucket and makes it publicly readable (listing images are public).
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 deadstock deadstock-secret; do sleep 1; done;
             mc mb -p local/deadstock && mc anonymous set download local/deadstock"

  # Production-style containers (local dev usually runs `pnpm dev` + `pnpm worker` instead).
  web:
    build: .
    profiles: [app]
    env_file: .env
    environment:
      DATABASE_URL: postgres://deadstock:deadstock@postgres:5432/deadstock
      S3_ENDPOINT: http://minio:9000
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    build: .
    profiles: [app]
    command: ["node_modules/.bin/tsx", "src/worker/index.ts"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://deadstock:deadstock@postgres:5432/deadstock
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
